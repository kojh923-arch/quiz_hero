<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1440">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>퀴즈 영웅전설 - 역사를 되찾아라</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --win1:#2a3aa8; --win2:#0d1550; --gold:#ffd23f; --hp:#3ee05a; --mp:#3fa9ff; --ink:#140c1c;
  --kfont:'Do Hyeon',system-ui,sans-serif; --pfont:'Press Start 2P',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#05030c;color:#fff;font-family:var(--kfont);overflow:hidden;user-select:none}
#game{position:relative;width:100vw;height:100vh;height:100dvh;max-width:1100px;max-height:760px;margin:0 auto;overflow:hidden;background:#0a0618;top:50%;transform:translateY(-50%)}
@media (min-height:761px){#game{border:4px solid #000;box-shadow:0 0 0 3px #3b3f8a,0 0 60px #2a1a6a}}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}
.hidden{display:none!important}
img.px,canvas.px{image-rendering:pixelated;image-rendering:crisp-edges}

/* ---------- JRPG window ---------- */
.win{background:linear-gradient(180deg,var(--win1),var(--win2));border:3px solid #f4f4ff;border-radius:7px;
  box-shadow:0 0 0 3px #000,inset 0 0 0 2px #5866e0,0 6px 0 3px rgba(0,0,0,.35);padding:12px 14px;position:relative}
.btn{font-family:var(--kfont);font-size:clamp(16px,2.3vw,21px);color:#fff;background:linear-gradient(180deg,#4a5ad8,#22308f);
  border:3px solid #fff;border-radius:6px;box-shadow:0 0 0 2px #000,0 4px 0 2px #000;padding:8px 14px;cursor:pointer;transition:transform .06s;position:relative}
.btn:hover{background:linear-gradient(180deg,#6676ff,#2c3cb0)}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 2px #000,0 1px 0 2px #000}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed}
.btn.gold{background:linear-gradient(180deg,#ffd84a,#d8941a);color:#3a1d00;border-color:#fff7c0}
.btn.red{background:linear-gradient(180deg,#ff5a5a,#a01a2a)}
.btn.green{background:linear-gradient(180deg,#4adf6a,#178a35)}
.btn.small{font-size:15px;padding:5px 10px}
.pnum{font-family:var(--pfont);font-size:11px;letter-spacing:1px}
.bar{height:12px;background:#1a0b14;border:2px solid #000;border-radius:3px;overflow:hidden;box-shadow:inset 0 0 0 1px #555}
.bar>i{display:block;height:100%;width:100%;transition:width .45s cubic-bezier(.3,1.4,.5,1);box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.25)}
.bar.hp>i{background:var(--hp)} .bar.hp.mid>i{background:#ffc93a} .bar.hp.low>i{background:#ff3b3b;animation:blink .5s steps(2) infinite}
.bar.mp>i{background:var(--mp)} .bar.xp>i{background:#c86bff}
@keyframes blink{50%{opacity:.4}}

/* ---------- Title ---------- */
#scr-title{background:radial-gradient(ellipse at 50% 120%,#3a1a6a 0%,#120a2a 55%,#05030c 100%)}
#tfx{position:absolute;inset:0;width:100%;height:100%}
.logo{position:absolute;top:9%;left:0;right:0;text-align:center}
.logo .sub{font-family:var(--pfont);font-size:clamp(9px,1.5vw,13px);color:#9fb0ff;letter-spacing:3px;margin-bottom:12px;text-shadow:2px 2px #000}
.logo h1{font-size:clamp(46px,9vw,92px);line-height:1;letter-spacing:2px;
  background:linear-gradient(180deg,#fff7c2 0%,#ffd23f 40%,#ff8a1a 70%,#b8400a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(4px 4px 0 #000) drop-shadow(0 0 18px rgba(255,170,40,.55));animation:logoIn 1.2s cubic-bezier(.2,1.6,.4,1) both}
.logo h2{font-size:clamp(22px,3.6vw,34px);color:#bfe8ff;text-shadow:3px 3px 0 #000,0 0 12px #38a8ff;margin-top:6px;animation:logoIn 1.2s .25s cubic-bezier(.2,1.6,.4,1) both}
@keyframes logoIn{from{transform:scale(2.4) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.tsprites{position:absolute;bottom:31%;left:50%;transform:translateX(-50%);display:flex;align-items:flex-end;gap:12vw}
.tsprites img{width:clamp(80px,13vw,128px)}
.tsprites .h{animation:bob 1s steps(2) infinite}
.tsprites .d{width:clamp(110px,18vw,180px);animation:bob 1.4s steps(2) infinite;filter:drop-shadow(0 0 14px #ff2a2a)}
.tmenu{position:absolute;bottom:6%;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:12px;width:min(92%,420px)}
.tmenu input{font-family:var(--kfont);font-size:22px;text-align:center;width:100%;padding:8px;border:3px solid #fff;border-radius:6px;background:#0d1550;color:#fff;box-shadow:0 0 0 2px #000;outline:none}
.tmenu .row{display:flex;gap:10px;width:100%}
.tmenu .row .btn{flex:1}
.press{font-family:var(--pfont);font-size:12px;color:#fff;animation:blink 1s steps(2) infinite;text-shadow:2px 2px #000}

/* ---------- Map ---------- */
#scr-map{background:#1d5fbf}
#mapc{position:absolute;inset:0;width:100%;height:100%}
.topbar{position:absolute;top:8px;left:8px;right:62px;display:flex;gap:10px;align-items:center;z-index:5;padding:8px 12px}
.topbar .nm{font-size:20px;white-space:nowrap}
.topbar .lv{font-family:var(--pfont);font-size:11px;color:var(--gold)}
.topbar .bars{flex:1;display:grid;grid-template-columns:auto 1fr auto;gap:3px 6px;align-items:center;min-width:120px}
.topbar .bars span{font-family:var(--pfont);font-size:8px}
.topbar .gold{font-family:var(--pfont);font-size:11px;color:var(--gold);white-space:nowrap}
.node{position:absolute;transform:translate(-50%,-80%);display:flex;flex-direction:column;align-items:center;cursor:pointer;z-index:3;transition:transform .15s}
.node:hover{transform:translate(-50%,-85%) scale(1.08)}
.node img{width:clamp(48px,7.5vw,72px);animation:bob 1.2s steps(2) infinite;filter:drop-shadow(0 4px 0 rgba(0,0,0,.4))}
.node .lbl{font-size:clamp(14px,2vw,18px);background:#000c;border:2px solid #fff;border-radius:5px;padding:2px 8px;white-space:nowrap;margin-top:2px}
.node .stars{font-family:var(--pfont);font-size:9px;color:var(--gold);margin-top:3px;text-shadow:1px 1px #000}
.node.locked img{filter:grayscale(1) brightness(.35)}
.node.locked .lbl{color:#999}
.node.cur::before{content:'▼';position:absolute;top:-22px;color:var(--gold);font-size:18px;animation:bob .6s steps(2) infinite;text-shadow:2px 2px #000}
.node.cleared .lbl{border-color:var(--gold)}
.mapbtns{position:absolute;bottom:10px;left:8px;right:8px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;z-index:5}
.mapbtns .btn{font-size:clamp(15px,2vw,19px);padding:7px 12px}

/* ---------- Battle ---------- */
#stage{position:absolute;left:0;right:0;top:0;height:60%;overflow:hidden;background:#000}
#bg{position:absolute;inset:0;width:100%;height:100%}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
#floaters{position:absolute;inset:0;pointer-events:none;z-index:8}
#flash{position:absolute;inset:0;pointer-events:none;z-index:9;opacity:0}
.actor{position:absolute;bottom:9%;display:flex;flex-direction:column;align-items:center;z-index:4}
#hero{left:14%}
#hero img{width:clamp(84px,14vw,136px)}
#mon{right:12%}
#mon img{width:clamp(100px,17vw,170px);transition:opacity .2s}
#mon.boss img{width:clamp(150px,25vw,250px)}
.actor img{animation:bob 1s steps(2) infinite}
.shadow{width:70%;height:10px;background:rgba(0,0,0,.4);border-radius:50%;margin-top:-6px}
.mtag{background:#000b;border:2px solid #fff;border-radius:5px;padding:3px 8px;margin-bottom:6px;text-align:center;min-width:130px}
.mtag .mn{font-size:clamp(15px,2vw,19px)}
.mtag .mn small{font-family:var(--pfont);font-size:8px;color:var(--gold);margin-left:4px}
.mtag .bar{height:9px;margin-top:3px}
#mon.boss .mtag{border-color:#ff4a4a;box-shadow:0 0 10px #f00}
#mon.rage img{filter:drop-shadow(0 0 10px #ff1a1a) drop-shadow(0 0 22px #ff6a00) saturate(1.5);animation:bob .5s steps(2) infinite}
#mon.boss:not(.rage) img{filter:drop-shadow(0 0 12px #b04aff)}
@keyframes bob{50%{transform:translateY(-4px)}}
.lungeR{animation:lungeR .38s ease-in-out!important}
@keyframes lungeR{40%{transform:translateX(160%) scale(1.1)}55%{transform:translateX(150%)}100%{transform:none}}
.lungeL{animation:lungeL .4s ease-in-out!important}
@keyframes lungeL{40%{transform:translateX(-120%) scale(1.15)}100%{transform:none}}
.hurt{animation:hurt .5s steps(2)!important}
@keyframes hurt{0%,100%{transform:none;filter:none}20%{transform:translateX(14px);filter:brightness(4) saturate(0)}40%{transform:translateX(-10px);filter:none}60%{transform:translateX(8px);filter:brightness(4) saturate(0)}80%{filter:none}}
.enter{animation:enter .7s cubic-bezier(.2,1.4,.4,1) both!important}
@keyframes enter{0%{transform:translateX(120%) scale(.4);opacity:0;filter:brightness(5)}60%{opacity:1;filter:brightness(3)}100%{transform:none;filter:none}}
.charge{animation:charge .8s ease-in-out!important}
@keyframes charge{0%,100%{transform:none}50%{transform:scale(1.15);filter:brightness(1.6) drop-shadow(0 0 20px #f0f)}}
.shake{animation:shake .45s}
@keyframes shake{10%{transform:translate(-8px,4px)}20%{transform:translate(8px,-6px)}30%{transform:translate(-10px,2px)}40%{transform:translate(9px,5px)}50%{transform:translate(-6px,-4px)}60%{transform:translate(5px,3px)}70%{transform:translate(-3px,-2px)}100%{transform:none}}
.bigshake{animation:bigshake .7s}
@keyframes bigshake{10%{transform:translate(-16px,8px)}20%{transform:translate(16px,-10px)}30%{transform:translate(-18px,6px)}40%{transform:translate(14px,10px)}50%{transform:translate(-12px,-8px)}60%{transform:translate(10px,6px)}70%{transform:translate(-6px,-4px)}85%{transform:translate(3px,2px)}100%{transform:none}}
.dmg{position:absolute;font-family:var(--pfont);font-size:clamp(18px,3vw,28px);color:#fff;transform:translate(-50%,-50%);
  text-shadow:3px 0 #000,-3px 0 #000,0 3px #000,0 -3px #000,3px 3px #000,-3px -3px #000,3px -3px #000,-3px 3px #000;animation:dmgPop 1.1s ease-out forwards;white-space:nowrap}
.dmg.crit{color:var(--gold);font-size:clamp(24px,4.4vw,42px)}
.dmg.hurtc{color:#ff5050}
.dmg.heal{color:#5aff7a}
.dmg.txt{font-family:var(--kfont);font-size:clamp(22px,3.6vw,36px);letter-spacing:1px}
@keyframes dmgPop{0%{transform:translate(-50%,-20%) scale(.3);opacity:0}15%{transform:translate(-50%,-90%) scale(1.35);opacity:1}30%{transform:translate(-50%,-80%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-170%);opacity:0}}
.banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:clamp(34px,7vw,70px);white-space:nowrap;
  background:linear-gradient(180deg,#fff 0%,#ffd23f 50%,#ff7a00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(4px 4px 0 #000) drop-shadow(0 0 16px #ffb000);animation:banner 1.6s ease-out forwards;z-index:10}
@keyframes banner{0%{transform:translate(-50%,-50%) scale(3);opacity:0}15%{transform:translate(-50%,-50%) scale(.9);opacity:1}22%{transform:translate(-50%,-50%) scale(1.05)}80%{opacity:1}100%{transform:translate(-50%,-70%) scale(1);opacity:0}}
.combo{position:absolute;right:12px;top:54px;font-family:var(--pfont);font-size:clamp(12px,2vw,18px);color:#ff9a3a;text-shadow:2px 2px #000,0 0 10px #f50;z-index:7;animation:pulse .5s}
@keyframes pulse{0%{transform:scale(1.8)}100%{transform:scale(1)}}
.stage-sub{position:absolute;left:10px;top:10px;font-size:16px;background:#000a;border:2px solid #fff;border-radius:5px;padding:2px 8px;z-index:7}

#panel{position:absolute;left:0;right:0;bottom:0;height:40%;padding:10px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);grid-template-rows:auto 1fr;gap:10px;background:#0a0618}
#msg{grid-column:1/3;font-size:clamp(16px,2.3vw,21px);min-height:46px;line-height:1.35;padding:8px 14px}
#msg .cur{display:inline-block;animation:blink .6s steps(2) infinite;color:var(--gold);margin-left:4px}
#hstat{display:flex;flex-direction:column;justify-content:center;gap:5px}
#hstat .r1{display:flex;justify-content:space-between;align-items:baseline}
#hstat .r1 b{font-size:clamp(18px,2.5vw,22px);font-weight:normal}
#hstat .row{display:grid;grid-template-columns:26px 1fr auto;gap:6px;align-items:center}
#hstat .row span{font-family:var(--pfont);font-size:9px}
#cmd{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}
#cmd .btn{display:flex;align-items:center;justify-content:center;gap:6px}
#sub{grid-column:2;display:flex;flex-direction:column;gap:6px;padding:8px;overflow:auto}
#sub .btn{display:flex;justify-content:space-between;font-size:clamp(14px,2vw,18px);padding:6px 10px}
#sub .btn em{font-style:normal;font-family:var(--pfont);font-size:9px;color:#bfe0ff;align-self:center}

#quiz{position:absolute;left:8px;right:8px;bottom:8px;top:calc(60% - 48px);z-index:20;display:flex;flex-direction:column;gap:8px;padding:12px 14px;animation:qin .3s cubic-bezier(.2,1.5,.4,1)}
@keyframes qin{from{transform:translateY(40px) scale(.95);opacity:0}}
#quiz .qh{display:flex;align-items:center;gap:10px}
#quiz .tag{font-size:15px;padding:2px 10px;border-radius:4px;border:2px solid #fff;background:#000}
#quiz .tbar{flex:1;height:14px}
#quiz .tbar>i{background:linear-gradient(90deg,#ff5a3a,#ffd23f);transition:none}
#quiz .tnum{font-family:var(--pfont);font-size:11px;min-width:30px;text-align:right}
#quiz .q{font-size:clamp(19px,3vw,28px);line-height:1.35;flex:0 0 auto;text-shadow:2px 2px 0 #000}
#quiz .ch{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1;min-height:0}
#quiz .ch .btn{text-align:left;font-size:clamp(15px,2.3vw,21px);display:flex;align-items:center;gap:10px;line-height:1.2;padding:6px 10px}
#quiz .ch .btn b{font-family:var(--pfont);font-size:11px;color:var(--gold);min-width:16px}
#quiz .ch .btn.ok{background:linear-gradient(180deg,#4adf6a,#178a35);animation:pulse .4s}
#quiz .ch .btn.no{background:linear-gradient(180deg,#ff5a5a,#a01a2a);animation:hurt .4s}
#quiz .ch .btn.dim{opacity:.45}
#quiz .exp{font-size:clamp(16px,2.2vw,20px);background:#000a;border:2px dashed #ffd23f;border-radius:6px;padding:8px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between}
#quiz .exp p{flex:1;line-height:1.35}
#quiz .crit-hint{font-size:15px;color:#ffd23f}

/* ---------- Modal ---------- */
#modal{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}}
#modal .box{width:min(560px,100%);max-height:100%;overflow:auto;animation:qin .35s cubic-bezier(.2,1.5,.4,1);font-size:clamp(16px,2.3vw,20px);line-height:1.45}
#modal h3{font-size:clamp(24px,3.6vw,32px);text-align:center;margin-bottom:8px;color:var(--gold);text-shadow:3px 3px 0 #000;font-weight:normal}
#modal .mbtns{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
#modal .mbtns .btn{min-width:120px}
.reward{display:flex;justify-content:center;gap:22px;margin:8px 0;font-family:var(--pfont);font-size:13px}
.reward .x{color:#d58bff}.reward .g{color:var(--gold)}
.lvup{font-family:var(--pfont);text-align:center;font-size:clamp(22px,4.5vw,36px);
  background:linear-gradient(180deg,#fff,#ffd23f,#ff8a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(3px 3px 0 #000);animation:pulse .6s;margin:6px 0 10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;font-size:18px;margin:6px auto;max-width:380px}
.stats div{display:flex;justify-content:space-between}
.stats b{font-family:var(--pfont);font-size:11px;color:#9df}
.stats .up{color:#5aff7a;font-family:var(--pfont);font-size:10px;margin-left:5px}
.newskill{text-align:center;margin-top:10px;padding:8px;border:2px solid var(--gold);border-radius:6px;background:#3a2a00aa;color:#ffe9a0;animation:pulse .6s}
.shoplist{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.shopitem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:#0006;border:2px solid #6a78e8;border-radius:6px;padding:6px 10px}
.shopitem .ic{font-size:26px}
.shopitem small{display:block;color:#b8c4ff;font-size:14px}
.shopitem .pr{font-family:var(--pfont);font-size:10px;color:var(--gold);text-align:right;margin-bottom:3px}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:6px}
.note{background:#0006;border-left:4px solid #ff6a6a;border-radius:4px;padding:6px 10px;margin:6px 0;font-size:17px}
.note .a{color:#7dff9a}.note .e{color:#c8d0ff;font-size:15px}
.note .sj{font-size:13px;border:1px solid #fff;border-radius:3px;padding:0 5px;margin-right:6px}
.story p{min-height:1.4em;margin:4px 0}
.mono{font-family:var(--pfont);font-size:11px}
#toast{position:absolute;left:0;right:0;top:14%;z-index:60;pointer-events:none;display:flex;flex-direction:column;align-items:center}
#toast div{background:#000d;border:2px solid var(--gold);border-radius:6px;padding:6px 14px;font-size:18px;animation:toastPop 1.8s forwards;position:relative;white-space:nowrap;margin:4px auto;width:max-content;max-width:90vw}
@keyframes toastPop{0%{opacity:0;transform:translateY(8px) scale(.9)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.sndbtn{position:absolute;right:10px;top:10px;z-index:30;font-size:18px;padding:4px 8px}


/* ---------- Field ---------- */
#scr-field{background:#000}
#fieldc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);touch-action:none;cursor:pointer;image-rendering:pixelated}
#f-top{position:absolute;top:8px;left:8px;right:62px;display:flex;gap:10px;align-items:center;z-index:5;padding:6px 10px}
#f-top .nm{font-size:clamp(16px,2.2vw,20px);white-space:nowrap}
#f-top .st{font-family:var(--pfont);font-size:9px;color:var(--gold);margin-top:3px;white-space:nowrap}
#f-top .fb{flex:1;display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;min-width:70px}
#f-top .fb span{font-family:var(--pfont);font-size:8px}
#dpad{position:absolute;left:12px;bottom:16px;z-index:6;display:none;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,60px);gap:4px;touch-action:none}
#dpad .btn{font-size:24px;padding:0;display:flex;align-items:center;justify-content:center;opacity:.88;touch-action:none}
@media (pointer:coarse),(max-width:700px){#dpad{display:grid}}
#modal .dexh{margin:8px 0 2px;color:var(--gold);font-size:17px}
#modal .dexg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#modal .dexc{text-align:center;font-size:14px;background:#ffffff12;border-radius:6px;padding:4px 2px}
#modal .dexc img{width:44px;height:44px;display:block;margin:0 auto}
#modal .dexc small{display:block;color:#9fb0ff;font-size:12px}
#modal .dexc.unk img{filter:brightness(0) opacity(.6)}
#modal .dexwrap{max-height:52vh;overflow:auto;margin:8px 0}
#modal .achi{display:flex;gap:8px;align-items:center;padding:6px 8px;margin:4px 0;border-radius:6px;background:#ffffff0d;opacity:.55}
#modal .achi.ok{opacity:1;background:#3a2a00aa;border:1px solid var(--gold);cursor:pointer}
#modal .achi small{display:block;color:#bcd;font-size:13px}
#modal .att{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}
#modal .att div{text-align:center;font-size:13px;padding:4px 0;border-radius:6px;background:#ffffff12;color:#9fb0ff}
#modal .att div.on{background:#3a2a00;border:1px solid var(--gold);color:#ffe9a0}
#modal .mbar{height:6px;margin-top:3px}#modal .mbar i{background:linear-gradient(90deg,#ffd23f,#ff9a3a)}

<body>
<div id="game">

  <!-- TITLE -->
  <div id="scr-title" class="screen on">
    <canvas id="tfx"></canvas>
    <div class="logo">
      <div class="sub">QUIZ HERO LEGEND</div>
      <h1>퀴즈 영웅전설</h1>
      <h2>~ 역사를 되찾아라 ~</h2>
    </div>
    <div class="tsprites"><img class="px h" id="t-hero" alt=""><img class="px d" id="t-drag" alt=""></div>
    <div class="tmenu">
      <div class="press" id="t-press">PRESS START</div>
      
      <div class="row">
        <button class="btn gold" id="t-new">⚔ 새로운 모험</button>
        <button class="btn" id="t-cont">▶ 이어하기</button>
      </div>
    </div>
  </div>

  <!-- MAP -->
  <div id="scr-map" class="screen">
    <canvas id="mapc" class="px"></canvas>
    <div class="topbar win">
      <div><div class="nm" id="m-name">용사</div><div class="lv" id="m-lv">LV 1</div></div>
      <div class="bars">
        <span>HP</span><div class="bar hp"><i id="m-hp"></i></div><span id="m-hpt" class="pnum">0</span>
        <span>MP</span><div class="bar mp"><i id="m-mp"></i></div><span id="m-mpt" class="pnum">0</span>
        <span>EXP</span><div class="bar xp"><i id="m-xp"></i></div><span id="m-xpt" class="pnum">0</span>
      </div>
      <div class="gold" id="m-gold">0 G</div>
    </div>
    <div id="nodes"></div>
    <div class="mapbtns">
      <button class="btn" id="b-town">🏠 마을</button>
      <button class="btn" id="b-note">📖 오답노트</button>
      <button class="btn" id="b-status">🛡 상태</button>
      <button class="btn" id="b-dex">🏅 도감</button>
      <button class="btn" id="b-mis">📅 미션</button>
      <button class="btn" id="b-opt">⚙ 설정</button>
    </div>
  </div>

  <!-- FIELD -->
  <div id="scr-field" class="screen">
    <canvas id="fieldc" class="px"></canvas>
    <canvas id="mini"></canvas>
    <div id="f-top" class="win">
      <div><div class="nm" id="f-region">필드</div><div class="st" id="f-kills"></div></div>
      <div class="fb"><span id="f-lv">LV1</span><div class="bar hp"><i id="f-hp"></i></div><span id="f-hpt"></span></div>
      <button class="btn small green" id="f-potion">🧪 <span id="f-pc">0</span></button>
      <button class="btn small" id="f-exit">🗺 지도</button>
    </div>
    <div id="f-hint" class="win">방향키·WASD로 걷기 (화면을 터치해도 이동!)<br>몬스터에 닿으면 전투! 🎁 상자를 찾아보세요<br>오른쪽 위 작은 지도로 위치 확인 · 보스는 맨 위 오른쪽!</div>
    <div id="dpad">
      <button class="btn" data-k="U" style="grid-area:1/2">▲</button>
      <button class="btn" data-k="L" style="grid-area:2/1">◀</button>
      <button class="btn" data-k="R" style="grid-area:2/3">▶</button>
      <button class="btn" data-k="D" style="grid-area:3/2">▼</button>
    </div>
  </div>

  <!-- BATTLE -->
  <div id="scr-battle" class="screen">
    <div id="stage">
      <canvas id="bg" class="px"></canvas>
      <div class="stage-sub" id="b-region">수학의 초원</div>
      <div id="combo"></div>
      <div class="actor" id="hero"><img class="px" alt=""><div class="shadow"></div></div>
      <div class="actor" id="mon">
        <div class="mtag"><div class="mn" id="mon-name">슬라임</div><div class="bar hp"><i id="mon-hp"></i></div></div>
        <img class="px" alt=""><div class="shadow"></div>
      </div>
      <canvas id="fx"></canvas>
      <div id="floaters"></div>
      <div id="flash"></div>
    </div>
    <div id="panel">
      <div id="msg" class="win"></div>
      <div id="hstat" class="win">
        <div class="r1"><b id="h-name">용사</b><span class="pnum" style="color:var(--gold)" id="h-lv">LV1</span></div>
        <div class="row"><span>HP</span><div class="bar hp" id="h-hpbar"><i id="h-hp"></i></div><span class="pnum" id="h-hpt"></span></div>
        <div class="row"><span>MP</span><div class="bar mp"><i id="h-mp"></i></div><span class="pnum" id="h-mpt"></span></div>
      </div>
      <div id="cmd" class="win">
        <button class="btn red" data-c="atk">⚔ 공격</button>
        <button class="btn" data-c="skill">✨ 스킬</button>
        <button class="btn green" data-c="item">🧪 아이템</button>
        <button class="btn" data-c="run">🏃 도망</button>
      </div>
      <div id="sub" class="win hidden"></div>
    </div>
    <div id="quiz" class="win hidden"></div>
  </div>

  <div id="wipe" class="hidden"></div>
  <button class="btn small sndbtn" id="snd">🔊</button>
  <div id="modal" class="hidden"><div class="box win"></div></div>
  <div id="toast"></div>
</div>

<script>

const QDATA = [

[4,'조선 시대에 백성이 유교의 가르침을 배우고 실천하도록 펴낸 책은?',['『삼강행실도』','『직지』','『농사직설』','『왕오천축국전』'],'『삼강행실도』는 충성, 효도 등의 모범을 그림과 글로 보여 주었어요.'],
[4,'세종 때 만든 우리 글자는?',['훈민정음','이두','한자','향찰'],'훈민정음은 백성이 쉽게 익히도록 만든 우리 글자예요.'],
[4,'『농사직설』은 어떤 책일까요?',['우리 땅에 맞는 농사법을 쓴 책','다른 나라를 여행하고 쓴 책','삼국의 역사를 정리한 책','유교의 예절을 그림으로 쓴 책'],'조선의 기후와 땅에 맞는 농사법을 담았어요.'],
[4,'비가 내린 양을 재는 세종 때의 과학 기구는?',['측우기','앙부일구','자격루','혼천의'],'측우기로 강수량을 재어 농사에 도움을 받았어요.'],

[4,'자동으로 종을 쳐서 시각을 알려 주는 세종 때의 물시계는?',['자격루','앙부일구','혼천의','측우기'],'자격루는 스스로 종을 쳐서 시각을 알려 주었어요.'],
[4,'해, 달, 별의 움직임을 관찰해 농사에 도움을 준 기구는?',['혼천의','측우기','자격루','앙부일구'],'혼천의는 천문을 관측하는 기구예요.'],
[4,'세종 시기의 발전에 대해 바르게 설명한 것은?',['과학 기구 덕분에 백성의 생활이 편리해졌다','훈민정음 때문에 글자 익히기가 더 어려워졌다','농사법 책이 도움이 되지 않았다','과학 기구는 쓸모가 없었다'],'훈민정음, 농사직설, 과학 기구 모두 백성의 삶에 도움이 되었어요.'],
[4,'조선이 건국된 지 약 200년 뒤, 일본이 쳐들어온 전쟁은?',['임진왜란','병자호란','6·25 전쟁','귀주 대첩'],'1592년에 일본이 조선을 침략한 임진왜란이 일어났어요.'],
[4,'임진왜란 때 바다에서 크게 활약한 장군은?',['이순신','강감찬','서희','김좌진'],'이순신이 이끈 수군이 바다에서 일본군을 물리쳤어요.'],
[4,'임진왜란 때 나라를 위해 스스로 일어나 싸운 백성들을 무엇이라고 할까요?',['의병','별무반','광복군','독립군'],'각지에서 의병이 일어나 일본군에 맞서 싸웠어요.'],
[4,'임진왜란과 거리가 먼 것은?',['귀주 대첩','이순신','의병의 활약','일본군의 조총'],'귀주 대첩은 고려와 거란의 싸움이에요.'],
[4,'이순신 장군이 임진왜란 때 사용한 배는?',['거북선','돛단배','뗏목','증기선'],'거북선은 이순신이 활약한 싸움의 대표적인 배예요.'],
[4,'임금과 신하의 관계를 맺자는 청의 요구를 조선이 거부하자 일어난 전쟁은?',['병자호란','임진왜란','6·25 전쟁','귀주 대첩'],'청이 조선을 침략해 병자호란이 일어났어요.'],
[4,'조선이 임진왜란을 이겨 낼 수 있었던 까닭으로 알맞은 것은?',['이순신의 수군과 의병의 활약','청나라 군대의 도움','일본이 스스로 물러나서','신식 대포 덕분에'],'수군과 의병, 그리고 명나라의 도움으로 위기를 이겨 냈어요.'],

// ---------- 5. 조선 후기 ----------
[5,'모내기법이란 어떤 농사법일까요?',['모판에서 키운 어린 모를 논에 옮겨 심는 방법','논에 볍씨를 바로 뿌려서 키우는 방법','논 대신 밭에서만 벼를 기르는 방법','소를 이용해 밭을 깊이 가는 방법'],'모내기는 어린 모를 논에 옮겨 심는 농사법이에요.'],
[5,'모내기법에 대한 설명으로 알맞지 않은 것은?',['일손을 더 많이 필요로 한다','쌀 생산량이 늘었다','조선 후기에 전국으로 퍼졌다','벼를 벤 땅에 보리를 심을 수 있었다'],'모내기법은 직접 볍씨를 뿌릴 때보다 일손이 훨씬 적게 들어요.'],

[5,'조선 후기에 외국에서 들어와 굶주림을 해결하는 데 도움이 된 작물은?',['고구마와 감자','쌀과 보리','콩과 팥','밀과 수수'],'고구마와 감자는 척박한 땅에서도 잘 자라 배고픔을 이기는 데 도움이 되었어요.'],
[5,'조선 후기에 큰 이익을 얻기 위해 길러 판 작물이 아닌 것은?',['쌀','인삼','담배','고추'],'인삼, 담배, 고추 같은 작물을 팔아 이익을 얻는 사람들이 나타났어요.'],
[5,'조선 후기에 물건을 사고팔려고 전국에 들어선 시장은?',['장시','백화점','편의점','마트'],'사람이 많이 모이는 곳에 장시가 들어섰어요.'],
[5,'장시를 돌아다니며 물건을 팔던 상인은?',['보부상','양반','의병','광대'],'보부상(등짐장수)은 장시를 돌며 물건을 팔았어요.'],
[5,'조선 후기에 전국에서 널리 쓰인 화폐는?',['상평통보','지폐 1만 원권','주화 500원','백동화'],'상업이 발달하면서 상평통보가 전국에서 쓰였어요.'],
[5,'상평통보가 물건을 사고팔기에 편리했던 까닭은?',['작고 썩지 않아 보관과 휴대가 쉬워서','쌀처럼 배고플 때 먹을 수 있어서','크고 무거워 도둑이 가져가기 어려워서','외국 상인들과만 쓸 수 있어서'],'쌀보다 보관이 쉽고 들고 다니기 간편했어요.'],
[5,'조선 후기의 경제 변화로 알맞지 않은 것은?',['장시가 줄고 보부상의 활동이 금지되었다','상평통보가 전국에서 널리 쓰였다','고구마와 감자 등을 길러 먹었다','모내기법이 전국으로 퍼져 나갔다'],'조선 후기에는 오히려 장시가 늘고 보부상의 활동이 활발해졌어요.'],

[5,'현실의 사회 문제를 해결하려는 학문으로 조선 후기에 나타난 것은?',['실학','성리학','불교','풍수지리'],'유학이 이론에 치우치자 백성을 위한 학문인 실학이 나타났어요.'],

[5,'조선 후기에 서민 문화가 발달한 까닭은?',['경제적 여유가 생긴 서민들이 문화와 예술에 관심을 가져서','양반들이 서민들에게 문화를 즐기라고 강요해서','중국에서 유행한 문화를 그대로 들여와서','서민 문화를 즐기는 것이 나라의 법이어서'],'농업과 상업이 발달해 서민들도 문화를 즐기게 되었어요.'],
[5,'『홍길동전』, 『심청전』 같은 작품은 어떤 서민 문화일까요?',['한글 소설','판소리','탈놀이','민화'],'한글 소설은 서민들의 감정과 소망을 담고 사회 문제를 비판했어요.'],
[5,'소리꾼이 북 치는 사람의 장단에 맞춰 노래와 말, 몸짓으로 이야기를 풀어 가는 공연은?',['판소리','탈놀이','풍속화','민화'],'판소리는 구경하는 사람도 함께 어울릴 수 있어 인기가 많았어요.'],
[5,'탈을 쓰고 춤과 재미난 동작으로 양반을 풍자하기도 한 놀이는?',['탈놀이','판소리','민화','풍속화'],'탈놀이는 서민들의 생각과 감정을 솔직하게 표현했어요.'],

[5,'다음 중 조선 후기의 서민 문화에 해당하지 않는 것은?',['한문 소설','판소리','탈놀이','민화'],'서민들이 즐긴 것은 한글 소설이에요.'],
[5,'조선 후기 모내기법으로 벼를 거둔 뒤 같은 땅에 할 수 있게 된 것은?',['보리 심기','소금 만들기','목화 따기','집 짓기'],'논에 보리 같은 작물을 이어서 기를 수 있었어요.'],

const CROWN=["....k..kk..k....","....kckcckck....","....kcccccck...."];
function withCrown(rows){ let f=rows.findIndex(r=>/[^.]/.test(r)); rows=rows.slice(); while(f<3){ rows.unshift('.'.repeat(16)); f++; } for(let i=0;i<3;i++) rows[f-3+i]=merge(rows[f-3+i],CROWN[i]); return rows; }
function merge(a,b){ let s=''; for(let i=0;i<16;i++){ const c=b[i]||'.'; s+= c!=='.'?c:(a[i]||'.'); } return s; }
const K='#140c1c';
const SPRCACHE={};
function makeSprite(rows,pal){
  const w=Math.max(...rows.map(r=>r.length)), h=rows.length;
  const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d');
  rows.forEach((r,y)=>{ for(let i=0;i<r.length;i++){ const ch=r[i]; const col= ch==='k'?(pal.k||K):pal[ch]; if(ch!=='.'&&col){ x.fillStyle=col; x.fillRect(i,y,1,1);} } });
  return c;
}
function spriteURL(key,rows,pal){ if(!SPRCACHE[key]){ const c=makeSprite(rows,pal); SPRCACHE[key]={c,url:c.toDataURL()}; } return SPRCACHE[key]; }

function numChoices(ans,cands){ const A=parseFloat(ans); const set=new Set([String(ans)]); const out=[String(ans)]; for(const c of shuffle(cands)){ const s=String(c); if(!set.has(s)&&!(parseFloat(s)<0)&&s!=='NaN'){set.add(s);out.push(s)} if(out.length===4)break; } let d=1; while(out.length<4){ const v=A+d*(d%2?1:-1); const s=Number.isInteger(A)?String(v):fmt(v); if(v>0&&!set.has(s)){set.add(s);out.push(s)} d++; } return out; }
const fmt=n=>String(Math.round(n*1000)/1000);
function genMath(){
  const t=rnd(7);
  if(t===0){ const k=pick([2,3,4,5,6,7,8,9,12]); let x,y; do{x=2+rnd(6);y=2+rnd(6)}while(x===y||gcd(x,y)!==1); const a=k*x,b=k*y;
    return {s:'math',q:`${a}와 ${b}의 최대공약수는?`,c:numChoices(k,[k*2,Math.floor(k/2)||1,x*y,a,b,k+1,k*x]),e:`${a}와 ${b}의 공약수 중 가장 큰 수는 ${k}`}; }
  if(t===1){ let a,b; do{a=2+rnd(10);b=2+rnd(10)}while(a===b); const l=a*b/gcd(a,b);
    return {s:'math',q:`${a}과(와) ${b}의 최소공배수는?`,c:numChoices(l,[a*b,l*2,gcd(a,b),a+b,l/2|0]),e:`${a}의 배수와 ${b}의 배수 중 가장 작은 공배수는 ${l}`}; }
  if(t===2){ const d=pick([7,9,11,13]); let a,b; do{a=1+rnd(d-2);b=1+rnd(d-2)}while(a+b>=d||gcd(a+b,d)!==1);
    const ans=`${a+b}/${d}`; return {s:'math',q:`${a}/${d} + ${b}/${d} 은?`,c:[...new Set([ans,`${a+b}/${d*2}`,`${a*b}/${d}`,`${Math.abs(a-b)||1}/${d}`,`${a+b+1}/${d}`,`${a+b}/${d+1}`])].slice(0,4),e:`분모가 같으면 분자끼리 더해요: ${a}+${b} = ${a+b} → ${ans}`}; }
  if(t===3){ const x=11+rnd(89), n=2+rnd(8); const ans=x*n/10;
    return {s:'math',q:`${fmt(x/10)} × ${n} 은?`,c:numChoices(fmt(ans),[fmt(x*n),fmt(x*n/100),fmt(ans+n/10),fmt(ans-1),fmt(ans+1)]),e:`${x} × ${n} = ${x*n} → 소수 한 자리 → ${fmt(ans)}`}; }
  if(t===4){ const n=3+rnd(2); const avg=60+rnd(30); let arr=[]; let sum=avg*n; for(let i=0;i<n-1;i++){ const v=avg+rnd(21)-10; arr.push(v); sum-=v; } arr.push(sum);
    return {s:'math',q:`${arr.join(', ')} 의 평균은?`,c:numChoices(avg,[avg+2,avg-3,avg+5,avg*n]),e:`(합계 ${avg*n}) ÷ ${n} = ${avg}`}; }
  if(t===5){ const k=rnd(3); const a=3+rnd(10), b=2+rnd(9);
    if(k===0) return {s:'math',q:`가로 ${a}cm, 세로 ${b}cm인 직사각형의 넓이는?`,c:numChoices(a*b,[2*(a+b),a+b,a*b+a]).map(v=>v+'㎠'),e:`가로 × 세로 = ${a} × ${b} = ${a*b}㎠`};
    const bb=b*2; if(k===1) return {s:'math',q:`밑변 ${a}cm, 높이 ${bb}cm인 삼각형의 넓이는?`,c:numChoices(a*bb/2,[a*bb,a+bb,a*bb/2+a]).map(v=>v+'㎠'),e:`밑변 × 높이 ÷ 2 = ${a} × ${bb} ÷ 2 = ${a*bb/2}㎠`};
    return {s:'math',q:`밑변 ${a}cm, 높이 ${b}cm인 평행사변형의 넓이는?`,c:numChoices(a*b,[a*b/2,2*(a+b),a+b]).map(v=>v+'㎠'),e:`평행사변형 넓이 = 밑변 × 높이 = ${a*b}㎠`}; }
  const a=10+rnd(40), b=2+rnd(8), c=2+rnd(8), d=1+rnd(9); const ans=a+b*c-d;
  return {s:'math',q:`${a} + ${b} × ${c} - ${d} 를 계산하면?`,c:numChoices(ans,[(a+b)*c-d,a+b*(c-d),a+b+c-d]),e:`곱셈 먼저! ${b}×${c}=${b*c} → ${a}+${b*c}-${d} = ${ans}`};
}

// ================= FX LAYER (particles) =================
class FXLayer{
  constructor(cv){ this.cv=cv; this.ctx=cv.getContext('2d'); this.ps=[]; this.ef=[]; this.amb=null; this.resize(); }
  resize(){ const r=this.cv.getBoundingClientRect(); const d=Math.min(2,window.devicePixelRatio||1); this.w=r.width; this.h=r.height; this.cv.width=Math.max(1,r.width*d); this.cv.height=Math.max(1,r.height*d); this.ctx.setTransform(d,0,0,d,0,0); }
  add(p){ p.life=p.life||1; p.t=0; p.g=p.g||0; p.drag=p.drag==null?1:p.drag; p.sz=p.sz||3; p.shape=p.shape||'sq'; this.ps.push(p); }
  burst(x,y,n,cols,o={}){ for(let i=0;i<n;i++){ const a=o.ang!=null?o.ang+rr(-o.spread,o.spread):Math.random()*Math.PI*2; const sp=rr(o.min||1,o.max||6); this.add({x:x+rr(-(o.r||0),o.r||0),y:y+rr(-(o.r||0),o.r||0),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,col:pick(cols),life:rr(o.lmin||.4,o.lmax||1),sz:rr(o.smin||2,o.smax||5),g:o.g||0,drag:o.drag||.96,shape:o.shape,grow:o.grow}); } }
  effect(dur,draw){ return new Promise(res=>this.ef.push({t:0,dur,draw,res})); }
  step(dt){
    const c=this.ctx; c.clearRect(0,0,this.w,this.h);
    if(this.amb) this.amb(this,dt);
    for(let i=this.ef.length-1;i>=0;i--){ const e=this.ef[i]; e.t+=dt; const k=Math.min(1,e.t/e.dur); c.save(); e.draw(c,k,e); c.restore(); if(k>=1){ this.ef.splice(i,1); e.res(); } }
    c.globalCompositeOperation='lighter';
    for(let i=this.ps.length-1;i>=0;i--){ const p=this.ps[i]; p.t+=dt; if(p.t>=p.life){this.ps.splice(i,1);continue;}
      const f=dt*60; p.vx*=Math.pow(p.drag,f); p.vy=p.vy*Math.pow(p.drag,f)+p.g*f; p.x+=p.vx*f; p.y+=p.vy*f;
      const k=1-p.t/p.life; let s=p.sz*(p.grow?(1+(1-k)*p.grow):k*.6+.4); c.globalAlpha=Math.min(1,k*1.5); c.fillStyle=p.col;
      if(p.shape==='circ'){ c.beginPath(); c.arc(p.x,p.y,s,0,7); c.fill(); }
      else if(p.shape==='star'){ c.fillRect(p.x-s,p.y-s/4,s*2,s/2); c.fillRect(p.x-s/4,p.y-s,s/2,s*2); }
      else if(p.shape==='line'){ c.strokeStyle=p.col; c.lineWidth=s/2; c.beginPath(); c.moveTo(p.x,p.y); c.lineTo(p.x-p.vx*3,p.y-p.vy*3); c.stroke(); }
      else if(p.shape==='pix'){ c.globalCompositeOperation='source-over'; c.fillRect(p.x-s/2,p.y-s/2,s,s); c.globalCompositeOperation='lighter'; }
      else c.fillRect(p.x-s/2,p.y-s/2,s,s);
    }
    c.globalAlpha=1; c.globalCompositeOperation='source-over';
  }
}

      <div class="tabs" style="margin-top:8px"><button class="btn small ${tab==='item'?'gold':''}" data-tab="item">아이템</button><button class="btn small ${tab==='wpn'?'gold':''}" data-tab="wpn">무기</button><button class="btn small ${tab==='arm'?'gold':''}" data-tab="arm">방어구</button></div>

    box.querySelector('[data-close]').onclick=()=>{ sfx.select(); $('#modal').classList.add('hidden'); };
  };

}

function drawBG(theme){
  const cv=$('#bg'), W=240, H=Math.round(240*($('#stage').clientHeight/$('#stage').clientWidth||.5)); cv.width=W; cv.height=H; const c=cv.getContext('2d');
  const T={
    meadow:{sky:['#3a8cf0','#7cc0ff','#bfe6ff'],m:'#6a8ad8',h:'#3faa4a',g:['#78d24c','#62bc3c'],deco:'sun'},
    forest:{sky:['#5a2a6a','#d8604a','#ffb86a'],m:'#6a3a5a',h:'#1e4a2e',g:['#3e7a3a','#33682f'],deco:'trees'},
    cave:{sky:['#0c0820','#1c1238','#2a1a4a'],m:'#2a1e44',h:'#3a2a5a',g:['#3a3058','#2c2446'],deco:'crystal'},
    castle:{sky:['#060a24','#141c4a','#2a3570'],m:'#151a38',h:'#2a2f50',g:['#44485e','#3a3d52'],deco:'castle'},
    beach:{sky:['#3a9cf0','#7cd0ff','#dff6ff'],m:'#7ab0e8',h:'#7ab0e8',g:['#f0dc90','#e8d084'],deco:'sea'},
    snow:{sky:['#5a7ab0','#a8c8e8','#e8f4ff'],m:'#c8dcf0',h:'#dbe9f8',g:['#f0f8ff','#e2eefa'],deco:'snow'},
    tower:{sky:['#1a0008','#5a0a1a','#b0302a'],m:'#2a0810',h:'#14080e',g:['#5a1414','#4a1010'],deco:'spire'},
  }[theme];
  const gy=Math.round(H*.7);
  for(let y=0;y<gy;y++){ const k=y/gy; const i=k<.5?0:1; const a=T.sky[i], b=T.sky[i+1]; const kk=k<.5?k*2:(k-.5)*2; c.fillStyle=(Math.floor(y/3)%2&&kk>.5)?b:(kk>.75?b:a); c.fillRect(0,y,W,1); }
  let seed=theme.length*99; const sr=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
  if(T.deco==='sun'||T.deco==='sea'){ c.fillStyle='#fff6b0'; c.beginPath(); c.arc(W*.8,H*.18,12,0,7); c.fill(); c.fillStyle='#fff'; for(let i=0;i<4;i++){ const x=sr()*W,y=sr()*H*.35; c.fillRect(x,y,26,5); c.fillRect(x+6,y-4,14,4);} }
  if(T.deco==='castle'||T.deco==='crystal'){ c.fillStyle='#fff'; for(let i=0;i<50;i++) c.fillRect(sr()*W,sr()*gy*.7,1,1); }
  if(T.deco==='castle'){ c.fillStyle='#fff6c8'; c.beginPath(); c.arc(W*.78,H*.2,13,0,7); c.fill(); c.fillStyle=T.sky[1]; c.beginPath(); c.arc(W*.78+6,H*.2-3,11,0,7); c.fill(); }
  // far mountains
  c.fillStyle=T.m; c.beginPath(); c.moveTo(0,gy); let x=0; while(x<W){ c.lineTo(x,gy-18-sr()*30); x+=12+sr()*20; } c.lineTo(W,gy); c.fill();
  // near layer
  c.fillStyle=T.h;
  if(T.deco==='trees'){ for(let i=0;i<16;i++){ const tx=sr()*W, th=20+sr()*30; c.beginPath(); c.moveTo(tx,gy-th); c.lineTo(tx-10,gy); c.lineTo(tx+10,gy); c.fill(); } }
  else if(T.deco==='crystal'){ for(let i=0;i<12;i++){ const tx=sr()*W, th=8+sr()*22; c.fillStyle='#3a2a5a'; c.beginPath(); c.moveTo(tx,th); c.lineTo(tx-6,0); c.lineTo(tx+6,0); c.fill(); }
    for(let i=0;i<8;i++){ const tx=sr()*W, th=8+sr()*16; c.fillStyle=pick(['#5ff0e8','#c86bff','#3ac0ff']); c.beginPath(); c.moveTo(tx,gy-th); c.lineTo(tx-4,gy); c.lineTo(tx+4,gy); c.fill(); c.fillStyle='#fff'; c.fillRect(tx-1,gy-th+3,1,4);} }
  else if(T.deco==='castle'){ c.fillRect(W*.15,gy-40,W*.7,40); for(let i=0;i<14;i++) c.fillRect(W*.15+i*W*.05,gy-46,W*.025,6); c.fillRect(W*.25,gy-62,18,62); c.fillRect(W*.65,gy-58,18,58); c.fillStyle='#ffd25a'; [[.28,-50],[.68,-46],[.4,-26],[.55,-26]].forEach(([a,b])=>c.fillRect(W*a,gy+b,3,4)); }
  else if(T.deco==='sea'){ c.fillStyle='#2a7ad0'; c.fillRect(0,gy-22,W,22); c.fillStyle='#5aa8f0'; for(let i=0;i<30;i++) c.fillRect(sr()*W,gy-22+sr()*22,6+sr()*8,1);
    for(let i=0;i<4;i++){ const tx=W*(.1+i*.27)+sr()*10; c.fillStyle='#7a4a1a'; c.fillRect(tx-1,gy-34,3,34); c.fillStyle='#2a9a3a'; c.beginPath(); c.moveTo(tx,gy-34); c.lineTo(tx-14,gy-26); c.lineTo(tx-4,gy-40); c.fill(); c.beginPath(); c.moveTo(tx,gy-34); c.lineTo(tx+14,gy-26); c.lineTo(tx+4,gy-40); c.fill(); } }
  else if(T.deco==='snow'){ for(let i=0;i<14;i++){ const tx=sr()*W, th=18+sr()*28; c.fillStyle='#2a6a54'; c.beginPath(); c.moveTo(tx,gy-th); c.lineTo(tx-9,gy); c.lineTo(tx+9,gy); c.fill(); c.fillStyle='#fff'; c.beginPath(); c.moveTo(tx,gy-th); c.lineTo(tx-4,gy-th+9); c.lineTo(tx+4,gy-th+9); c.fill(); } c.fillStyle=T.h; }
  else if(T.deco==='spire'){ for(let i=0;i<7;i++){ const tx=W*(.08+i*.14), th=40+sr()*40; c.fillRect(tx-5,gy-th,10,th); c.beginPath(); c.moveTo(tx,gy-th-14); c.lineTo(tx-7,gy-th); c.lineTo(tx+7,gy-th); c.fill(); c.fillStyle='#ff3a2a'; c.fillRect(tx-1,gy-th+8,2,3); c.fillStyle=T.h; } }
  else { c.beginPath(); c.moveTo(0,gy); x=0; while(x<W){ c.lineTo(x,gy-6-sr()*10); x+=8+sr()*10; } c.lineTo(W,gy); c.fill(); }
  // ground checker
  for(let y=gy;y<H;y++){ const row=Math.floor((y-gy)/4); for(let xx=0;xx<W;xx+=8){ c.fillStyle=((Math.floor(xx/8)+row)%2)?T.g[0]:T.g[1]; c.fillRect(xx,y,8,1);} }
  c.fillStyle='rgba(0,0,0,.25)'; c.fillRect(0,gy,W,2);
  if(T.deco==='spire'){ c.fillStyle='#ff6a1a'; for(let i=0;i<20;i++) c.fillRect(sr()*W,gy+4+sr()*(H-gy-4),4+sr()*8,1); }
  if(T.deco==='sun'){ c.fillStyle='#ffe85a'; for(let i=0;i<20;i++) c.fillRect(sr()*W,gy+3+sr()*(H-gy-3),1,1); c.fillStyle='#ff7ab0'; for(let i=0;i<14;i++) c.fillRect(sr()*W,gy+3+sr()*(H-gy-3),1,1); }
  // ambient
  BFX.amb={
    meadow:(L)=>{ if(Math.random()<.05) L.add({x:-5,y:rr(0,L.h*.6),vx:rr(1,2),vy:rr(-.2,.4),col:pick(['#ffc0e0','#fff']),life:8,sz:3,drag:1}); },
    forest:(L)=>{ if(Math.random()<.12) L.add({x:rr(0,L.w),y:rr(L.h*.3,L.h*.9),vx:rr(-.3,.3),vy:rr(-.3,.3),col:'#d8ff5a',life:rr(1,2.5),sz:3,shape:'circ',drag:1}); },
    cave:(L)=>{ if(Math.random()<.08) L.add({x:rr(0,L.w),y:rr(0,L.h*.7),vx:0,vy:rr(-.2,-.05),col:pick(['#5ff0e8','#c86bff']),life:rr(1,2),sz:3,shape:'star',drag:1}); },
    castle:(L)=>{ if(Math.random()<.04) L.add({x:rr(0,L.w),y:L.h*.7,vx:rr(-.2,.2),vy:-rr(.2,.5),col:'#8aa0ff',life:3,sz:6,shape:'circ',drag:1}); },
    beach:(L)=>{ if(Math.random()<.1) L.add({x:rr(0,L.w),y:rr(L.h*.45,L.h*.7),vx:0,vy:0,col:'#fff',life:rr(.4,.9),sz:2,shape:'star',drag:1}); },
    snow:(L)=>{ if(Math.random()<.4) L.add({x:rr(0,L.w),y:-4,vx:rr(-.4,.2),vy:rr(.6,1.4),col:'#fff',life:rr(3,5),sz:rr(2,3.5),shape:'circ',drag:1}); },
    tower:(L)=>{ if(Math.random()<.35) L.add({x:rr(0,L.w),y:L.h+4,vx:rr(-.5,.5),vy:-rr(.8,2.4),col:pick(['#ff6a1a','#ffb03a','#ff3a1a']),life:rr(1.5,3),sz:rr(2,4),drag:1}); },
  }[theme];
}

let B=null;
const busy={v:false};
function center(el){ const s=$('#stage').getBoundingClientRect(), r=el.getBoundingClientRect(); return {x:r.left-s.left+r.width/2,y:r.top-s.top+r.height/2,w:r.width,h:r.height}; }
function floater(x,y,txt,cls=''){ const d=document.createElement('div'); d.className='dmg '+cls; d.textContent=txt; d.style.left=x+'px'; d.style.top=y+'px'; $('#floaters').appendChild(d); setTimeout(()=>d.remove(),1200); }
function banner(txt){ const d=document.createElement('div'); d.className='banner'; d.textContent=txt; $('#stage').appendChild(d); setTimeout(()=>d.remove(),1700); }
function flash(col='#fff',dur=300,op=.85){ const f=$('#flash'); f.style.background=col; f.animate([{opacity:op},{opacity:0}],{duration:dur,easing:'ease-out'}); }
function shake(big){ const s=$('#stage'); s.classList.remove('shake','bigshake'); void s.offsetWidth; s.classList.add(big?'bigshake':'shake'); }
function anim(el,cls,ms){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); return sleep(ms).then(()=>el.classList.remove(cls)); }
async function say(t,wait=500){ const m=$('#msg'); m.innerHTML=''; const sp=document.createElement('span'); m.appendChild(sp); for(const ch of t){ sp.textContent+=ch; await sleep(16); } m.insertAdjacentHTML('beforeend','<span class="cur">▼</span>'); await sleep(wait); }
function updH(){

function setCombo(){ const c=$('#combo'); c.innerHTML= B.combo>=2?`<div class="combo">${B.combo} COMBO!</div>`:''; }

async function startBattle(ri,boss,fm){
  const r=REGIONS[ri]; const id=fm?fm.id:(boss?r.boss:pick(r.mons)); const M=MONS[id];
  const lvm=ri*2+1+(boss?2:rnd(2));
  let hp=28+ri*36, atk=Math.round(6+ri*4.5); if(boss){hp=Math.round(hp*3.2); atk=Math.round(atk*1.35);} hp=Math.round(hp*rr(.9,1.1));
  B={ri,boss,id,m:{n:M.n,hp,maxhp:hp,atk,lv:lvm},combo:0,turn:0,rage:false,over:false,fm:fm||null};
  S.battles++; S.seen[id]=1;
  show('scr-battle'); drawBG(r.theme); playBGM(boss?'boss':'battle'); if(fm) wipeOut();
  $('#b-region').textContent=r.name;
  const monEl=$('#mon'); monEl.className='actor'+(boss?' boss':''); const img=monEl.querySelector('img'); img.style.opacity=1; img.src=monSprite(id).url;
  $('#mon-name').innerHTML=`${M.n}<small>Lv${lvm}</small>`; updM(); updH(); setCombo();
  $('#cmd').classList.add('hidden'); $('#sub').classList.add('hidden'); $('#quiz').classList.add('hidden');
  monEl.querySelector('.mtag').style.visibility='hidden';
  await sleep(120); BFX.resize();
  if(boss){ flash('#000',600,1); sfx.roar(); shake(true); }
  else sfx.appear();
  await anim(img,'enter',700); monEl.querySelector('.mtag').style.visibility='visible';
  const p=center(img); BFX.burst(p.x,p.y,30,['#fff','#ffe07a'],{max:5,smax:4});
  await say(boss?`⚠ 보스 ${M.n}이(가) 나타났다!!`:`야생의 ${M.n}이(가) 나타났다!`,600);
  if(boss&&BOSS_STORY[ri]) await say('"'+BOSS_STORY[ri].line+'"',2200);
  menu();
}

async function runAway(){
  busy.v=true; $('#cmd').classList.add('hidden');
  if(B.boss){ await say('보스에게서는 도망칠 수 없다!',800); return menu(); }
  if(Math.random()<.75){ sfx.run(); await anim($('#hero'),'lungeL',300); await say(`${S.name}은(는) 무사히 도망쳤다!`,600); BFX.ps=[]; return B.fm?backToField(false):goMap(); }
  await say('도망치지 못했다!',400); await monsterAttack(); if(S.hp>0) menu();
}

async function act(sk){
  busy.v=true; $('#cmd').classList.add('hidden'); $('#sub').classList.add('hidden');
  B.turn++;
  const q=(B.review&&reviewQ())||nextQ(pickEra(B.ri,B.boss));
  const res=await askQuestion(q,Math.max(10,S.cfg.time-(B.boss?3:0)));
  S.total++; bump('q');
  if(res.ok){
    S.correct++; B.combo++; S.maxCombo=Math.max(S.maxCombo,B.combo); setCombo(); bump('ok'); bump('c',B.combo); if(B.review) reviewHit(q);
    if(sk.mp) S.mp-=sk.mp; S.mp=Math.min(S.maxmp,S.mp+2); updH();
    const crit=res.time<6 || Math.random()<.08;
    await heroAttack(sk,crit);
    if(B.m.hp<=0) return victory();
  } else {
    B.combo=0; setCombo();
    S.wrong.push({s:q.s,q:q.q,a:q.c[0],my:res.my||'(시간 초과)',e:q.e}); if(S.wrong.length>80) S.wrong.shift();
    sfx.miss(); const p=center($('#mon img')); floater(p.x,p.y-40,'MISS','txt');
    await say(res.my?`앗! 공격이 빗나갔다...`:`시간 초과! 공격 기회를 놓쳤다...`,350);
    await monsterAttack();
    if(S.hp<=0) return;
  }
  save();
  if(B.boss && !B.rage && B.m.hp<B.m.maxhp*.5){ B.rage=true; $('#mon').classList.add('rage'); sfx.roar(); shake(true); flash('#f00',500,.5); await say(`${B.m.n}이(가) 분노했다!! 공격력이 올라간다!`,700); }
  menu();
}

async function heroAttack(sk,crit){
  const heroImg=$('#hero img'), monImg=$('#mon img');
  await say(`${S.name}의 ${sk.n}!${crit?' 회심의 일격!!':''}`,150);
  if(sk.fx==='slash') { anim($('#hero'),'lungeR',380); await sleep(170); }
  else { const h=center(heroImg); castFx(h.x,h.y,sk.fx); await sleep(380); }
  const p=center(monImg);
  await FXS[sk.fx](p.x,p.y,crit);
  let dmg=ATK()*sk.mult*rr(.9,1.1)*(1+Math.min(.5,(B.combo-1)*.1)); if(crit) dmg*=1.8; dmg=Math.max(1,Math.round(dmg));
  B.m.hp-=dmg; updM();
  anim(monImg,'hurt',500);
  if(crit){ sfx.crit(); shake(true); flash('#fff',250,.9); floater(p.x,p.y-20,dmg,'crit'); floater(p.x,p.y-p.h*.6,'CRITICAL!','txt crit'); BFX.burst(p.x,p.y,40,['#fff','#ffe07a','#ffb03a'],{max:9,smax:6}); }
  else { sfx.hit(); shake(false); floater(p.x,p.y-20,dmg); BFX.burst(p.x,p.y,18,['#fff','#ffe07a'],{max:6}); }
  if(B.combo>=3 && B.combo%3===0){ await sleep(200); banner(`${B.combo} COMBO!`); sfx.ok(); }
  await sleep(550);
}
async function monsterAttack(){
  const monEl=$('#mon'), heroImg=$('#hero img');
  const special=B.boss && B.turn%3===0;
  if(special){ await say(`${B.m.n}이(가) 힘을 모으고 있다...!`,200); sfx.roar(); await anim(monEl.querySelector('img'),'charge',800); }
  else await say(`${B.m.n}의 공격!`,150);
  anim(monEl,'lungeL',400); await sleep(170);
  const h=center(heroImg);
  await clawFx(h.x,h.y,special);
  let dmg=B.m.atk*(B.rage?1.35:1)*(special?1.6:1)*rr(.85,1.15)-DEF()*.5; dmg=Math.max(1,Math.round(dmg));
  S.hp=Math.max(0,S.hp-dmg); updH(); sfx.hurt(); shake(special); flash('#f00',300,.45);
  anim(heroImg,'hurt',500); floater(h.x,h.y-20,dmg,'hurtc');
  await sleep(450);
  await say(`${S.name}은(는) ${dmg}의 피해를 입었다!`,500);
  if(S.hp<=0) await defeat();
}

// ---------- QUESTION UI ----------
function askQuestion(q,limit){
  return new Promise(resolve=>{
    const Z=$('#quiz'); const choices=shuffle(q.c); const correct=q.c[0];
    Z.innerHTML=`<div class="qh"><span class="tag">${SUBJ[q.s]}</span><div class="bar tbar"><i></i></div><span class="tnum">${limit}</span></div>
      <div class="q">${esc(q.q)}</div><div class="ch">${choices.map((c,i)=>`<button class="btn" data-i="${i}"><b>${i+1}</b><span>${esc(c)}</span></button>`).join('')}</div>
      <div class="crit-hint">⚡ 6초 안에 맞히면 크리티컬!</div>`;
    Z.classList.remove('hidden'); sfx.appear();
    const t0=performance.now(); let done=false; const tb=Z.querySelector('.tbar i'), tn=Z.querySelector('.tnum');
    let lastSec=limit;
    const tick=()=>{ if(done) return; const el=(performance.now()-t0)/1000; const left=Math.max(0,limit-el); tb.style.width=(left/limit*100)+'%'; const s=Math.ceil(left); if(s!==lastSec){ lastSec=s; tn.textContent=s; if(s<=5&&s>0) tone(1000,.04,'square',.04);} if(left<=0) finish(-1); else requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
    const btns=[...Z.querySelectorAll('.ch .btn')];
    const kh=e=>{ const n=parseInt(e.key); if(n>=1&&n<=4&&!done){ finish(n-1); } };
    document.addEventListener('keydown',kh);
    btns.forEach(b=>b.onclick=()=>finish(+b.dataset.i));
    async function finish(i){
      if(done) return; done=true; document.removeEventListener('keydown',kh);
      const time=(performance.now()-t0)/1000; const my=i>=0?choices[i]:null; const ok=my===correct;
      btns.forEach((b,j)=>{ b.disabled=true; b.style.filter='none'; const c=choices[j]; if(c===correct) b.classList.add('ok'); else if(j===i) b.classList.add('no'); else b.classList.add('dim'); });
      Z.querySelector('.crit-hint').remove();
      if(ok){ sfx.ok(); const b=btns[i]; const s=$('#stage').getBoundingClientRect(), r=b.getBoundingClientRect(); BFX.burst(r.left-s.left+r.width/2,r.top-s.top+r.height/2,0,['#fff']); await sleep(650); Z.classList.add('hidden'); resolve({ok,time,my}); }
      else {
        sfx.miss();
        const ex=document.createElement('div'); ex.className='exp'; ex.innerHTML=`<p>${i<0?'⏰ 시간 초과! ':''}정답은 <b style="color:#7dff9a">${esc(correct)}</b><br>💡 ${esc(q.e)}</p><button class="btn gold small">확인 ▶</button>`;
        Z.querySelector('.ch').after(ex);
        const go=()=>{ document.removeEventListener('keydown',ek); Z.classList.add('hidden'); resolve({ok,time,my}); };
        const ek=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); sfx.select(); go(); } };
        setTimeout(()=>document.addEventListener('keydown',ek),400);
        ex.querySelector('button').onclick=()=>{ sfx.select(); go(); };
      }
    }
  });
}

// ---------- EFFECTS ----------
const FXS={
  slash:(x,y,crit)=>{ sfx.slash(); const n=crit?4:3;
    return BFX.effect(.32,(c,k)=>{ c.lineCap='round'; for(let i=0;i<n;i++){ const off=(i-(n-1)/2)*22; const kk=clamp(k*1.6-i*.15,0,1); if(kk<=0) continue;
      const x1=x-70+off, y1=y-70, x2=x+70+off, y2=y+70; c.globalAlpha=1-Math.max(0,k-.5)*2; c.shadowColor=crit?'#ffd23f':'#5ff0ff'; c.shadowBlur=18;
      c.strokeStyle='#fff'; c.lineWidth=(crit?9:6)*(1-k*.6); c.beginPath(); c.moveTo(x1,y1); c.lineTo(x1+(x2-x1)*kk,y1+(y2-y1)*kk); c.stroke(); } }); },
  fire:(x,y,crit)=>{ sfx.fire(); for(let i=0;i<(crit?110:70);i++) BFX.add({x:x+rr(-40,40),y:y+rr(-10,50),vx:rr(-1.5,1.5),vy:rr(-5,-1.5),col:pick(['#ff3a1a','#ff8a1a','#ffd23f','#fff3a0']),life:rr(.5,1.1),sz:rr(5,12),shape:'circ',drag:.97,grow:-.5});
    flash('#ff6a00',350,.45);
    return BFX.effect(.5,(c,k)=>{ c.globalAlpha=1-k; c.strokeStyle='#ffb03a'; c.lineWidth=8*(1-k); c.shadowColor='#ff5a00'; c.shadowBlur=20; c.beginPath(); c.arc(x,y,20+k*120,0,7); c.stroke(); }); },
  ice:(x,y,crit)=>{ sfx.ice(); const sh=[]; for(let i=0;i<14;i++){ const a=i/14*Math.PI*2; sh.push({a,r:160}); }
    return BFX.effect(.45,(c,k)=>{ c.shadowColor='#7fe8ff'; c.shadowBlur=14; sh.forEach(s=>{ const r=s.r*(1-k); const px=x+Math.cos(s.a)*r, py=y+Math.sin(s.a)*r; c.save(); c.translate(px,py); c.rotate(s.a); c.fillStyle='#dff8ff'; c.beginPath(); c.moveTo(14,0); c.lineTo(0,5); c.lineTo(-14,0); c.lineTo(0,-5); c.fill(); c.restore(); }); })
      .then(()=>{ flash('#bff4ff',300,.7); BFX.burst(x,y,crit?80:50,['#fff','#bff4ff','#5fd8ff'],{max:9,smax:7,shape:'sq'}); return BFX.effect(.4,(c,k)=>{ c.globalAlpha=(1-k)*.8; c.fillStyle='#bff4ff'; c.beginPath(); for(let i=0;i<6;i++){ const a=i/6*Math.PI*2; c.lineTo(x+Math.cos(a)*(30+k*60),y+Math.sin(a)*(30+k*60)); } c.fill(); }); }); },
  thunder:(x,y,crit)=>{ sfx.thunder(); flash('#fff8a0',500,.9); shake(true);
    return BFX.effect(.55,(c,k)=>{ const bolts=crit?3:2; for(let b=0;b<bolts;b++){ if(Math.random()<.25) continue; c.strokeStyle=Math.random()<.5?'#fff':'#ffe94a'; c.shadowColor='#ffe94a'; c.shadowBlur=24; c.lineWidth=rr(3,7); c.beginPath(); let px=x+rr(-60,60), py=-10; c.moveTo(px,py); while(py<y){ px+=rr(-24,24); py+=rr(14,30); c.lineTo(px,Math.min(py,y)); } c.lineTo(x,y); c.stroke(); }
      if(Math.random()<.4) BFX.burst(x,y,6,['#fff','#ffe94a'],{max:8,shape:'line',smax:6}); }); },
  meteor:(x,y,crit)=>{ sfx.meteor(); const n=crit?8:6; const ms=[]; for(let i=0;i<n;i++) ms.push({d:i*.07,ox:rr(-50,50),oy:rr(-30,30),hit:false});
    return BFX.effect(1.1,(c,k,e)=>{ ms.forEach(m=>{ const kk=clamp((k*1.1-m.d)/.5,0,1); if(kk<=0) return; const tx=x+m.ox, ty=y+m.oy; const sx=tx-320, sy=ty-380;
      if(kk<1){ const px=sx+(tx-sx)*kk, py=sy+(ty-sy)*kk; c.shadowColor='#ff8a1a'; c.shadowBlur=24; c.fillStyle='#fff3a0'; c.beginPath(); c.arc(px,py,9,0,7); c.fill(); BFX.add({x:px,y:py,vx:rr(-1,1),vy:rr(-1,1),col:pick(['#ff8a1a','#ffd23f','#ff3a1a']),life:.4,sz:8,shape:'circ',grow:-.6}); }
      else if(!m.hit){ m.hit=true; BFX.burst(tx,ty,30,['#fff','#ffd23f','#ff6a1a','#ff2a1a'],{max:9,smax:8,shape:'circ'}); shake(true); noise(.3,.25,0,80); } });
      if(k>.75){ const kk=(k-.75)/.25; c.globalAlpha=1-kk; c.fillStyle='#fff'; c.beginPath(); c.arc(x,y,40+kk*220,0,7); c.fill(); }
    }).then(()=>flash('#fff',500,1)); },
};
function castFx(x,y,kind){ const col={fire:['#ff8a1a','#ffd23f'],ice:['#bff4ff','#5fd8ff'],thunder:['#ffe94a','#fff'],meteor:['#ffd23f','#fff','#ff8a1a']}[kind]||['#fff'];
  tone(400,.35,'triangle',.06,800);
  for(let i=0;i<40;i++){ const a=Math.random()*Math.PI*2, r=rr(40,80); BFX.add({x:x+Math.cos(a)*r,y:y+Math.sin(a)*r,vx:-Math.cos(a)*r/22,vy:-Math.sin(a)*r/22,col:pick(col),life:.4,sz:4,shape:'star',drag:1}); }
  BFX.effect(.4,(c,k)=>{ c.globalAlpha=1-k; c.strokeStyle=col[0]; c.lineWidth=3; c.shadowColor=col[0]; c.shadowBlur=12; c.beginPath(); c.ellipse(x,y+40,50*(1-k*.3),14,0,0,7); c.stroke(); c.beginPath(); c.ellipse(x,y+40,30,8,0,0,7); c.stroke(); });
}
function clawFx(x,y,big){ return BFX.effect(.3,(c,k)=>{ c.lineCap='round'; for(let i=0;i<3;i++){ const off=(i-1)*18; const kk=clamp(k*1.5-i*.12,0,1); c.globalAlpha=1-Math.max(0,k-.5)*2; c.strokeStyle=big?'#ff3aff':'#ff3a3a'; c.shadowColor=c.strokeStyle; c.shadowBlur=14; c.lineWidth=big?9:6; c.beginPath(); c.moveTo(x+50+off,y-50); c.lineTo(x+50+off-100*kk,y-50+100*kk); c.stroke(); } }).then(()=>BFX.burst(x,y,big?30:14,['#ff3a3a','#fff'],{max:6})); }
function healFx(x,y,cols=['#5aff7a','#c8ffd0','#fff']){ for(let i=0;i<30;i++) BFX.add({x:x+rr(-35,35),y:y+rr(-10,40),vx:0,vy:-rr(1,2.5),col:pick(cols),life:rr(.6,1.2),sz:rr(4,7),shape:'star',drag:.99});
  BFX.effect(.7,(c,k)=>{ c.globalAlpha=(1-k)*.6; const g=c.createLinearGradient(0,y-100,0,y+60); g.addColorStop(0,'transparent'); g.addColorStop(1,cols[0]); c.fillStyle=g; c.fillRect(x-40,y-100,80,160); }); }
function deathFx(){
  const img=$('#mon img'); const cv=SPRCACHE['m_'+B.id].c; const r=center(img); const W=cv.width,H=cv.height; const px=r.w/W; const d=cv.getContext('2d').getImageData(0,0,W,H).data;
  const x0=r.x-r.w/2, y0=r.y-r.h/2;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const i=(y*W+x)*4; if(d[i+3]<10) continue; const col=`rgb(${d[i]},${d[i+1]},${d[i+2]})`;
    const cx=x0+(x+.5)*px, cy=y0+(y+.5)*px; const a=Math.atan2(cy-r.y,cx-r.x)+rr(-.4,.4); const sp=rr(1,5);
    BFX.add({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-rr(1,3),col,life:rr(.7,1.5),sz:px,g:.12,drag:.98,shape:'pix'}); }
  img.style.opacity=0;
}
function levelFx(){ const h=center($('#hero img')); sfx.levelup();
  for(let i=0;i<70;i++) BFX.add({x:h.x+rr(-40,40),y:h.y+rr(-10,60),vx:rr(-.5,.5),vy:-rr(1.5,5),col:pick(['#ffd23f','#fff','#ffb03a']),life:rr(.8,1.6),sz:rr(3,7),shape:'star',drag:.98});
  return BFX.effect(1.2,(c,k)=>{ const a=k<.2?k/.2:1-(k-.2)/.8; c.globalAlpha=a*.85; const g=c.createLinearGradient(h.x-50,0,h.x+50,0); g.addColorStop(0,'transparent'); g.addColorStop(.5,'#fff6b0'); g.addColorStop(1,'transparent'); c.fillStyle=g; c.fillRect(h.x-50,0,100,h.y+h.h/2); c.globalAlpha=a; c.strokeStyle='#ffd23f'; c.lineWidth=3; c.beginPath(); c.ellipse(h.x,h.y+h.h/2-6,60*k+20,12,0,0,7); c.stroke(); }); }

// ---------- RESULTS ----------
async function victory(){
  busy.v=true; B.over=true;
  await sleep(200); flash('#fff',400,1); sfx.hit(); deathFx(); await sleep(900);
  playBGM('victory');
  const ri=B.ri; const exp=Math.round((10+ri*10)*(B.boss?4:1)*rr(.9,1.1)); const gold=Math.round((8+ri*10)*(B.boss?5:1)*rr(.85,1.15));
  let drop=''; if(Math.random()<(B.boss?1:.22)){ if(Math.random()<.6){S.potion++;drop='🧪 체력 포션'} else {S.ether++;drop='💧 마나 포션'} }
  banner('VICTORY!'); sfx.win();
  await say(`${B.m.n}을(를) 물리쳤다!`,600);
  S.gold+=gold*(B.review?2:1); S.exp+=exp; bump('w');
  if(!B.boss) S.kills[ri]++;
  S.dex[B.id]=(S.dex[B.id]||0)+1;
  await modal(`<h3>⚔ 승리!</h3><p style="text-align:center">${B.m.n}을(를) 물리쳤다!</p>
    <div class="reward"><span class="x">EXP +${exp}</span><span class="g">GOLD +${gold}</span></div>${drop?`<p style="text-align:center">✨ ${drop}을(를) 얻었다!</p>`:''}
    ${!B.boss&&S.kills[ri]===KILLS_FOR_BOSS&&!S.boss[ri]?'<div class="newskill">💀 보스의 기운이 느껴진다... 이제 보스에 도전할 수 있다!</div>':''}`,[{t:'계속 ▶',v:1,cls:'gold'}]);
  if(B.boss) await storyCard(ri);
  while(S.exp>=needExp(S.lv)) await levelUp();
  save();
  if(B.boss){
    const first=!S.boss[ri]; S.boss[ri]=1;
    if(!S.gear.includes(ri)){ S.gear.push(ri); save(); await gearModal(ri); }
    await checkAch();
    if(ri===REGIONS.length-1){ if(first||!S.ended){ S.ended=1; save(); return ending(); } }
    else if(first){ S.unlocked=Math.max(S.unlocked,ri+2); save(); await modal(`<h3>🌟 ${REGIONS[ri].name} 해방!</h3><p style="text-align:center">지역에 평화가 돌아왔다!<br>새로운 지역 <b style="color:var(--gold)">${REGIONS[ri+1].name}</b>(으)로 가는 길이 열렸다!</p>`,[{t:'지도로 ▶',v:1,cls:'gold'}]); }
    return goMap();
  }
  await checkAch();
  if(B.fm) return backToField(true);
  const v=await modal('<h3>다음은?</h3>',[{t:'⚔ 계속 탐험',v:'go',cls:'gold'},{t:'🗺 지도로',v:'map'}]);
  if(v==='go') startBattle(ri,false); else goMap();
}
async function levelUp(){
  const old={hp:S.maxhp,mp:S.maxmp,atk:S.atk,def:S.def};
  S.exp-=needExp(S.lv); S.lv++; S.maxhp+=12; S.maxmp+=4; S.atk+=3; S.def+=1; S.hp=S.maxhp; S.mp=S.maxmp; updH();
  banner('LEVEL UP!'); await levelFx();
  const sk=SKILLS.find(k=>k.lv===S.lv);
  await modal(`<div class="lvup">LEVEL UP!</div><p style="text-align:center" class="mono">LV ${S.lv-1} → <span style="color:var(--gold)">LV ${S.lv}</span></p>
    <div class="stats"><div>최대 HP<b>${S.maxhp}<span class="up">+12</span></b></div><div>최대 MP<b>${S.maxmp}<span class="up">+4</span></b></div><div>공격력<b>${S.atk}<span class="up">+3</span></b></div><div>방어력<b>${S.def}<span class="up">+1</span></b></div></div>
    <p style="text-align:center;color:#7dff9a">HP와 MP가 모두 회복되었다!</p>${sk?`<div class="newskill">${sk.ic} 새로운 스킬 <b>「${sk.n}」</b>을(를) 배웠다!<br><small>MP ${sk.mp} · 위력 x${sk.mult}</small>${sk.story?`<br><i style="color:#fff">${sk.story}</i>`:''}</div>`:''}`,[{t:'좋아! ▶',v:1,cls:'gold'}]);
}
async function defeat(){
  B.over=true; sfx.lose(); playBGM(null);
  const img=$('#hero img'); img.animate([{transform:'none',filter:'none'},{transform:'rotate(90deg) translateY(20%)',filter:'grayscale(1)'}],{duration:600,fill:'forwards'});
  flash('#000',900,.8); await sleep(900);
  const lost=Math.floor(S.gold*.1); S.gold-=lost; S.hp=S.maxhp; S.mp=S.maxmp; save();
  await modal(`<h3 style="color:#ff6a6a">${esc(S.name)}은(는) 쓰러졌다...</h3><p style="text-align:center">마을 사람들이 구해 주었다!<br>HP·MP가 회복되었다. ${lost?`(골드 ${lost} G를 잃었다)`:''}</p><p style="text-align:center;color:#9fb0ff;font-size:16px">💡 오답노트로 복습하고, 마을에서 장비를 강화해 보세요!</p>`,[{t:'다시 일어선다 ▶',v:1,cls:'gold'}]);
  img.getAnimations().forEach(a=>a.cancel());
  goMap();
}
async function ending(){
  show('scr-title'); playBGM('title');

const RC=(c,col,x,y,w,h)=>{c.fillStyle=col;c.fillRect(x,y,w,h);};
const FGROUND={meadow:['#78d24c','#6cc444'],forest:['#3e7a3a','#37702f'],cave:['#4a4068','#413860'],castle:['#5a5e74','#525670'],beach:['#f0dc90','#e8d084'],snow:['#eef6ff','#e2eefa'],tower:['#3a1010','#461414']};

function paintGround(c,th,tx,ty){

  else if(th==='forest'){ for(let i=0;i<2;i++) RC(c,'#2a5a28',x+n(),y+n(),1,2); if(Math.random()<.08) RC(c,'#b8602a',x+n(),y+n(),2,1); if(Math.random()<.04){ const fx=x+n(),fy=y+n(); RC(c,'#f3dcb0',fx,fy+1,1,2); RC(c,'#e8384a',fx-1,fy,3,1);} }
  else if(th==='cave'){ for(let i=0;i<3;i++) RC(c,'#5a4e80',x+n(),y+n(),1,1); if(Math.random()<.06) RC(c,'#5ff0e8',x+n(),y+n(),1,1); }
  else if(th==='castle'){ RC(c,'#3f4358',x,y+15,TS,1); RC(c,'#3f4358',x+((ty%2)?7:15),y,1,TS); if(Math.random()<.1) RC(c,'#3a3d52',x+n(),y+n(),3,1); }
  else if(th==='beach'){ for(let i=0;i<3;i++) RC(c,'#d4b86a',x+n(),y+n(),1,1); if(Math.random()<.05){ const fx=x+n(),fy=y+n(); RC(c,'#ffffff',fx,fy,2,1); RC(c,'#ffc0d0',fx,fy+1,2,1);} if(Math.random()<.02){ const fx=x+n(),fy=y+n(); RC(c,'#ff7a5a',fx,fy,3,1); RC(c,'#ff7a5a',fx+1,fy-1,1,3); } }
  else if(th==='snow'){ for(let i=0;i<3;i++) RC(c,'#c8dcf0',x+n(),y+n(),1,1); if(Math.random()<.04) RC(c,'#bfe6ff',x+n(),y+n(),2,1); }
  else { RC(c,'#2a0a0a',x+n(),y+n(),3,2); if(Math.random()<.18){ const fx=x+n(),fy=y+n(); RC(c,'#ff6a1a',fx,fy,3,1); RC(c,'#ffb03a',fx+1,fy,1,1);} }
}
function paintObs(c,th,tx,ty){
  const x=tx*TS, y=ty*TS, v=Math.random();
  if(th==='meadow'){ RC(c,'rgba(0,0,0,.25)',x+2,y+13,12,3); RC(c,'#7a4a22',x+6,y+9,4,6); RC(c,'#145a22',x+2,y+3,12,8); RC(c,'#1f7a2e',x+3,y+2,10,8); RC(c,'#2f9a3e',x+4,y+1,8,4); RC(c,'#6af07a',x+5,y+3,3,2); if(v>.6) RC(c,'#ff5a7a',x+9,y+6,2,2); }
  else if(th==='forest'){ RC(c,'rgba(0,0,0,.3)',x+2,y+13,12,3); RC(c,'#5a3a1a',x+7,y+11,3,4); RC(c,'#0f3a1e',x+2,y+8,12,4); RC(c,'#17502a',x+3,y+5,10,4); RC(c,'#1f6a36',x+5,y+2,6,4); RC(c,'#2a8a46',x+7,y+0,2,3); RC(c,'#3aa860',x+4,y+9,2,1); }
  else if(th==='cave'){ const col=pick(['#5ff0e8','#c86bff','#3ac0ff']); RC(c,'rgba(0,0,0,.3)',x+2,y+13,12,3); c.fillStyle='#3a2a5a'; c.beginPath(); c.moveTo(x+3,y+14); c.lineTo(x+1,y+8); c.lineTo(x+5,y+9); c.fill(); c.fillStyle=col; c.beginPath(); c.moveTo(x+8,y); c.lineTo(x+13,y+14); c.lineTo(x+3,y+14); c.fill(); RC(c,'#ffffff',x+7,y+3,1,6); c.fillStyle='rgba(0,0,0,.25)'; c.beginPath(); c.moveTo(x+8,y); c.lineTo(x+13,y+14); c.lineTo(x+9,y+14); c.fill(); }
  else if(th==='castle'){ RC(c,'rgba(0,0,0,.3)',x+2,y+14,12,2); RC(c,'#6a6e88',x+3,y+2,10,13); RC(c,'#9a9eb8',x+4,y+2,3,12); RC(c,'#4a4e68',x+10,y+2,3,13); RC(c,'#b8bcd4',x+2,y+0,12,3); RC(c,'#4a4e68',x+2,y+13,12,2); }
  else if(th==='beach'){
    if(v>.7){ RC(c,'rgba(0,0,0,.2)',x+2,y+13,12,3); RC(c,'#7a7a88',x+3,y+7,10,7); RC(c,'#a8a8b8',x+4,y+7,6,2); RC(c,'#5a5a68',x+9,y+10,4,4); }
    else { RC(c,'rgba(0,0,0,.2)',x+3,y+13,10,3); RC(c,'#8a5a2a',x+7,y+6,2,9); RC(c,'#a8723a',x+8,y+6,1,9); c.fillStyle='#2a9a3a'; c.beginPath(); c.moveTo(x+8,y+5); c.lineTo(x+0,y+8); c.lineTo(x+4,y+3); c.fill(); c.beginPath(); c.moveTo(x+8,y+5); c.lineTo(x+16,y+8); c.lineTo(x+12,y+3); c.fill(); c.fillStyle='#3ab04a'; c.beginPath(); c.moveTo(x+8,y+5); c.lineTo(x+3,y+0); c.lineTo(x+13,y+0); c.fill(); RC(c,'#7a4a1a',x+7,y+6,2,2); } }
  else if(th==='snow'){ RC(c,'rgba(0,0,0,.15)',x+2,y+13,12,3); RC(c,'#5a3a1a',x+7,y+11,3,4); RC(c,'#1f5a44',x+2,y+8,12,4); RC(c,'#2a7a5a',x+3,y+5,10,4); RC(c,'#2a7a5a',x+5,y+2,6,4); RC(c,'#ffffff',x+3,y+7,4,1); RC(c,'#ffffff',x+9,y+10,4,1); RC(c,'#ffffff',x+5,y+2,6,1); RC(c,'#ffffff',x+7,y+0,2,2); }
  else { RC(c,'rgba(255,90,20,.25)',x+1,y+12,14,4); c.fillStyle='#1a0a14'; c.beginPath(); c.moveTo(x+8,y); c.lineTo(x+14,y+14); c.lineTo(x+2,y+14); c.fill(); c.fillStyle='#3a1424'; c.beginPath(); c.moveTo(x+8,y); c.lineTo(x+4,y+14); c.lineTo(x+2,y+14); c.fill(); RC(c,'#ff3a2a',x+7,y+7,2,2); }
}

function genField(ri,cols,rows){
  const th=REGIONS[ri].theme;
  const T=[]; for(let y=0;y<rows;y++) T.push(new Array(cols).fill(0));
  for(let x=0;x<cols;x++){T[0][x]=1;T[rows-1][x]=1;} for(let y=0;y<rows;y++){T[y][0]=1;T[y][cols-1]=1;}
  const start={tx:2,ty:rows-2}, portal={tx:1,ty:rows-2}, boss={tx:cols-3,ty:2};
  const near=(x,y,p,r)=>Math.abs(x-p.tx)<=r&&Math.abs(y-p.ty)<=r;
  const ok=(x,y)=>x>0&&y>0&&x<cols-1&&y<rows-1&&!near(x,y,start,2)&&!near(x,y,boss,2);
  const blobs=Math.round(cols*rows/85);
  for(let b=0;b<blobs;b++){ const cx=1+rnd(cols-2), cy=1+rnd(rows-2), r=2+rnd(2); for(let y=cy-r;y<=cy+r;y++) for(let x=cx-r;x<=cx+r;x++){ if(!ok(x,y)) continue; const d=Math.hypot(x-cx,y-cy); if(d<=r&&Math.random()<.8-d*.1) T[y][x]=1; } }
  for(let y=1;y<rows-1;y++) for(let x=1;x<cols-1;x++){ if(ok(x,y)&&Math.random()<.035) T[y][x]=1; }
  const bfs=()=>{ const r=Array.from({length:rows},()=>new Array(cols).fill(false)); const q=[[start.tx,start.ty]]; r[start.ty][start.tx]=true;
    while(q.length){ const [x,y]=q.pop(); for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+dx, ny=y+dy; if(!T[ny]||T[ny][nx]!==0||r[ny][nx]) continue; r[ny][nx]=true; q.push([nx,ny]); } } return r; };
  let reach=bfs();
  if(!reach[boss.ty][boss.tx]){ for(let x=Math.min(start.tx,boss.tx);x<=Math.max(start.tx,boss.tx);x++) T[start.ty][x]=0; for(let y=Math.min(start.ty,boss.ty);y<=Math.max(start.ty,boss.ty);y++) T[y][boss.tx]=0; reach=bfs(); }
  const free=[];
  for(let y=1;y<rows-1;y++) for(let x=1;x<cols-1;x++){ if(T[y][x]===0&&!reach[y][x]) T[y][x]=1; else if(T[y][x]===0&&Math.hypot(x-start.tx,y-start.ty)>4) free.push([x,y]); }
  const bg=document.createElement('canvas'); bg.width=cols*TS; bg.height=rows*TS; const c=bg.getContext('2d');
  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++) paintGround(c,th,x,y);
  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++) if(T[y][x]===1) paintObs(c,th,x,y);
  const mm=document.createElement('canvas'); mm.width=cols*2; mm.height=rows*2; const m=mm.getContext('2d');
  m.fillStyle='rgba(10,6,24,.82)'; m.fillRect(0,0,mm.width,mm.height);
  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){ m.fillStyle=T[y][x]===1?'rgba(60,90,70,.9)':'rgba(210,225,200,.35)'; m.fillRect(x*2,y*2,2,2); }
  return {T,bg,mm,start,portal,boss,free};
}

function solidAt(px,py){ const tx=Math.floor(px/TS), ty=Math.floor(py/TS); return !F.T[ty]||F.T[ty][tx]!==0; }
function blockedBox(x,y,hw){ return solidAt(x-hw,y)||solidAt(x+hw,y)||solidAt(x-hw,y-5)||solidAt(x+hw,y-5); }
function moveEnt(e,dx,dy,hw){ const nx=e.x+dx; if(!blockedBox(nx,e.y,hw)) e.x=nx; const ny=e.y+dy; if(!blockedBox(e.x,ny,hw)) e.y=ny; }
function addP(x,y,vx,vy,life,col,sz,g){ if(F.ps.length>260) return; F.ps.push({x,y,vx,vy,l:life,L:life,col,sz:sz||1.5,g:g||0}); }
function poof(x,y,big){ for(let i=0;i<(big?34:14);i++) addP(x,y,rr(-34,34),rr(-38,6),rr(.3,.8),pick(['#ffffff','#ffe07a','#bff4ff']),rr(1,2.6),30); }

function spawnMon(boss){
  const r=REGIONS[F.ri]; let x,y;
  if(boss){ x=F.boss.tx*TS+8; y=F.boss.ty*TS+14; }
  else { for(let k=0;k<60;k++){ const t=pick(F.free); x=t[0]*TS+8; y=t[1]*TS+14; if(Math.hypot(x-F.h.x,y-F.h.y)>110&&F.mons.every(m=>Math.hypot(m.x-x,m.y-y)>40)) break; } }
  const m={id:boss?r.boss:pick(r.mons),boss:!!boss,x,y,state:'wander',timer:rr(.3,1.5),dx:0,dy:0,stun:0,alert:0,ph:Math.random()*6,moving:false};
  F.mons.push(m); poof(x,y-6,boss); return m;
}
function fieldBossCheck(){
  if(S.kills[F.ri]>=KILLS_FOR_BOSS && !F.mons.some(m=>m.boss)){ spawnMon(true); sfx.roar(); F.shake=.5; toast('💀 보스가 나타났다! 지도 오른쪽 위에서 기다리고 있어요!'); }
}
function fieldHUD(){

  $('#f-kills').textContent=S.boss[F.ri]&&k<KILLS_FOR_BOSS?'★ CLEAR':(k>=KILLS_FOR_BOSS?'💀 BOSS 출현!':'●'.repeat(k)+'○'.repeat(KILLS_FOR_BOSS-k));
  $('#f-lv').textContent='LV'+S.lv; $('#f-hp').style.width=(S.hp/S.maxhp*100)+'%'; $('#f-hpt').textContent=S.hp+'/'+S.maxhp; $('#f-pc').textContent=S.potion;
  const q=S.hp/S.maxhp; $('#f-hp').parentElement.className='bar hp'+(q<.25?' low':q<.5?' mid':'');
}
function layoutField(){
  if(!F) return; const G=$('#game'), cv=$('#fieldc'); const w=F.vc*TS, h=F.vr*TS; const s=Math.min(G.clientWidth/w,G.clientHeight/h);
  cv.style.width=(w*s)+'px'; cv.style.height=(h*s)+'px';
}
function startField(ri){
  ac(); FK.clear(); FP.clear();
  const G=$('#game'), cw=G.clientWidth, ch=G.clientHeight, tp=clamp(Math.min(cw,ch)/10,36,64), port=ch>cw;
  const vc=clamp(Math.floor(cw/tp),9,24), vr=clamp(Math.floor(ch/tp),9,22);
  const cols=port?26:40, rows=port?38:26;
  const g=genField(ri,cols,rows);
  F={ri,cols,rows,vc,vr,cx:0,cy:0,T:g.T,bg:g.bg,mm:g.mm,free:g.free,boss:g.boss,h:{x:g.start.tx*TS+8,y:g.start.ty*TS+14,face:1,walk:0,moving:false,dust:0,regen:0,stuck:0},
     mons:[],chests:[],ps:[],texts:[],respawn:[],t:0,frozen:false,flash:0,shake:0,grace:1.2,target:null,
     maxMons:clamp(Math.round(cols*rows/110),6,10),portal:{x:g.portal.tx*TS+8,y:g.portal.ty*TS+8,armed:false}};
  const cv=$('#fieldc'); cv.width=vc*TS; cv.height=vr*TS;
  const mc=$('#mini'); mc.width=cols*2; mc.height=rows*2; mc.style.width=(cols*(port?2:2.6))+'px'; mc.style.height=(rows*(port?2:2.6))+'px';
  camSnap();
  show('scr-field'); playBGM('field'); layoutField();
  for(let i=0;i<F.maxMons;i++) spawnMon(false);
  const spots=shuffle(g.free.filter(t=>Math.hypot(t[0]*TS-F.h.x,t[1]*TS-F.h.y)>80)).slice(0,3+rnd(2));
  spots.forEach(t=>F.chests.push({x:t[0]*TS+8,y:t[1]*TS+14}));
  fieldBossCheck(); fieldHUD();
  const hint=$('#f-hint'); hint.style.opacity=1; setTimeout(()=>{ hint.style.opacity=0; },8000);
}
function camTarget(){ const vw=F.vc*TS, vh=F.vr*TS; return [clamp(F.h.x-vw/2,0,Math.max(0,F.cols*TS-vw)),clamp(F.h.y-8-vh/2,0,Math.max(0,F.rows*TS-vh))]; }
function camSnap(){ const [x,y]=camTarget(); F.cx=x; F.cy=y; }

// ---------- screen wipe (encounter transition) ----------
const WIPE=$('#wipe'); for(let i=0;i<9;i++) WIPE.appendChild(document.createElement('i'));
function wipeIn(){ WIPE.classList.remove('hidden'); tone(300,.35,'square',.05,700); [...WIPE.children].forEach((b,i)=>b.animate([{transform:`translateX(${i%2?'':'-'}101%)`},{transform:'translateX(0)'}],{duration:280,delay:i*35,fill:'both',easing:'ease-out'})); return sleep(280+9*35+60); }
function wipeOut(){ const bars=[...WIPE.children]; bars.forEach((b,i)=>b.animate([{transform:'translateX(0)'},{transform:`translateX(${i%2?'-':''}101%)`}],{duration:300,delay:i*30,fill:'both',easing:'ease-in'})); return sleep(300+9*30+40).then(()=>{ WIPE.classList.add('hidden'); bars.forEach(b=>b.getAnimations().forEach(a=>a.cancel())); }); }

// ---------- encounters ----------
async function encounter(m){
  if(!F||F.frozen) return; F.frozen=true; F.target=null; FK.clear(); FP.clear(); m.alert=1; F.h.alert=1;
  sfx.appear(); F.flash=.55; if(m.boss) sfx.roar(); F.shake=.3;
  await sleep(650); F.flash=0; F.h.alert=0;
  await wipeIn(); startBattle(F.ri,m.boss,m);
}
async function backToField(won){
  const m=B.fm; await sleep(150); await wipeIn(); show('scr-field'); playBGM('field');
  if(won){ F.mons=F.mons.filter(x=>x!==m); poof(m.x,m.y-6,true); if(!m.boss) F.respawn.push(rr(3,6)); }
  else { m.stun=3; m.state='wander'; }
  F.frozen=false; F.grace=1.5; fieldHUD(); fieldBossCheck(); wipeOut();
}
async function exitField(){
  if(!F||F.frozen) return; F.frozen=true; FK.clear(); FP.clear(); sfx.run(); await wipeIn(); F=null; goMap(); wipeOut();
}
function openChest(c){
  c.done=true; sfx.coin(); let msg;
  const v=Math.random();
  if(v<.6){ const g=Math.round((8+F.ri*7)*(1+rnd(2))); S.gold+=g; msg=g+'G'; F.texts.push({x:c.x,y:c.y-12,t:0,txt:'+'+g+'G',col:'#ffd23f'}); }
  else if(v<.85){ S.potion++; msg='체력 포션'; F.texts.push({x:c.x,y:c.y-12,t:0,txt:'POTION',col:'#5aff7a'}); }
  else { S.ether++; msg='마나 포션'; F.texts.push({x:c.x,y:c.y-12,t:0,txt:'ETHER',col:'#5ab8ff'}); }
  for(let i=0;i<22;i++) addP(c.x,c.y-6,rr(-30,30),rr(-50,-10),rr(.4,.9),pick(['#ffd23f','#fff6a0','#ffffff']),rr(1,2.5),90);
  toast('🎁 상자에서 '+msg+'을(를) 얻었다!'); save(); fieldHUD();

// ---------- update / draw ----------
function fieldStep(dt){
  F.t+=dt; if(F.shake>0) F.shake-=dt; if(F.grace>0) F.grace-=dt; if(F.flash>0) F.flash-=dt;
  const h=F.h;
  if(!F.frozen && $('#modal').classList.contains('hidden')){
    let dx=0, dy=0;
    if(FK.has('L')||FP.has('L')) dx--; if(FK.has('R')||FP.has('R')) dx++; if(FK.has('U')||FP.has('U')) dy--; if(FK.has('D')||FP.has('D')) dy++;
    if(dx||dy) F.target=null;
    else if(F.target){ const tx=F.target.x-h.x, ty=F.target.y-h.y+6, d=Math.hypot(tx,ty); if(d<2.5) F.target=null; else { dx=tx/d; dy=ty/d; } }
    if(dx||dy){ const l=Math.hypot(dx,dy); dx/=l; dy/=l; const sp=62, ox=h.x, oy=h.y; moveEnt(h,dx*sp*dt,dy*sp*dt,5);
      const moved=Math.hypot(h.x-ox,h.y-oy); h.moving=moved>.05;
      if(F.target&&moved<sp*dt*.3){ h.stuck+=dt; if(h.stuck>.35){ F.target=null; h.stuck=0; } } else h.stuck=0;
      if(Math.abs(dx)>.25) h.face=dx>0?1:-1;
    } else h.moving=false;
    if(h.moving){ h.walk+=dt; h.dust-=dt; if(h.dust<=0){ h.dust=.1; addP(h.x+rr(-2,2),h.y-1,rr(-8,8),rr(-10,-2),.35,'#e8dcc0',1.5,20); }
      if(S.hp<S.maxhp||S.mp<S.maxmp){ h.regen+=dt; if(h.regen>=3){ h.regen=0; S.hp=Math.min(S.maxhp,S.hp+1); S.mp=Math.min(S.maxmp,S.mp+1); addP(h.x,h.y-14,0,-12,.7,'#5aff7a',2); fieldHUD(); } } }
    for(const m of F.mons){
      if(m.stun>0) m.stun-=dt;
      const dxh=h.x-m.x, dyh=h.y-m.y, d=Math.hypot(dxh,dyh)||1, sight=m.boss?78:62;
      if(m.alert>0){ m.alert-=dt; m.moving=false; }
      else if(m.stun<=0&&d<sight){
        if(m.state!=='chase'){ m.state='chase'; m.alert=.5; sfx.cursor(); if(m.boss){ F.shake=.3; sfx.roar(); } }
        else { const sp=m.boss?20:32; moveEnt(m,dxh/d*sp*dt,dyh/d*sp*dt,m.boss?7:5); m.moving=true; }
      } else {
        if(m.state==='chase') m.state='wander';
        m.timer-=dt; if(m.timer<=0){ if(Math.random()<.4){ m.dx=0; m.dy=0; } else { const a=Math.random()*Math.PI*2; m.dx=Math.cos(a); m.dy=Math.sin(a); } m.timer=rr(.8,2.2); }
        if(!m.boss&&(m.dx||m.dy)){ const ox=m.x, oy=m.y; moveEnt(m,m.dx*12*dt,m.dy*12*dt,5); if(Math.hypot(m.x-ox,m.y-oy)<.01) m.timer=0; m.moving=true; } else m.moving=false;
      }
      if(F.grace<=0&&m.stun<=0&&d<(m.boss?14:11)){ encounter(m); break; }
    }
    for(const c of F.chests) if(!c.done&&Math.hypot(h.x-c.x,h.y-(c.y-4))<11) openChest(c);
    F.chests=F.chests.filter(c=>!c.done);
    const pd=Math.hypot(h.x-F.portal.x,h.y-F.portal.y); if(pd>26) F.portal.armed=true; if(F.portal.armed&&pd<9) exitField();
    for(let i=F.respawn.length-1;i>=0;i--){ F.respawn[i]-=dt; if(F.respawn[i]<=0){ F.respawn.splice(i,1); if(F.mons.filter(m=>!m.boss).length<F.maxMons) spawnMon(false); } }
  }
  if(!F) return;
  // camera follows the hero
  { const [tx,ty]=camTarget(); const k=Math.min(1,dt*9); F.cx+=(tx-F.cx)*k; F.cy+=(ty-F.cy)*k; }
  // ambient particles (inside the visible area)
  const th=REGIONS[F.ri].theme, vw=F.vc*TS, vh=F.vr*TS, X=()=>F.cx+rr(0,vw), Y=()=>F.cy+rr(0,vh);
  if(Math.random()<dt*7){
    if(th==='meadow') addP(F.cx-2,F.cy+rr(0,vh*.7),rr(8,16),rr(5,10),8,'#ffc0e0',1.5);
    else if(th==='forest') addP(X(),Y(),rr(-3,3),rr(-3,3),2.5,'#d8ff5a',1.5);
    else if(th==='cave') addP(X(),Y(),0,rr(-3,-1),2,pick(['#5ff0e8','#c86bff']),1.5);
    else if(th==='castle') addP(X(),F.cy+vh,rr(-2,2),rr(-8,-3),4,'#8aa0ff',1.5);
    else if(th==='beach') addP(F.cx-2,Y(),rr(10,20),rr(-2,2),6,'#ffffff',1.2);
    else if(th==='snow'){ addP(X(),F.cy-2,rr(-4,4),rr(10,18),6,'#ffffff',1.6); addP(X(),F.cy-2,rr(-4,4),rr(10,18),6,'#ffffff',1.2); }
    else addP(X(),F.cy+vh,rr(-4,4),rr(-14,-6),3,pick(['#ff6a1a','#ffb03a']),1.5);
  }
  for(let i=F.ps.length-1;i>=0;i--){ const p=F.ps[i]; p.l-=dt; if(p.l<=0){ F.ps.splice(i,1); continue; } p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; }
  for(let i=F.texts.length-1;i>=0;i--){ const t=F.texts[i]; t.t+=dt; t.y-=14*dt; if(t.t>1) F.texts.splice(i,1); }
  drawField(); drawMini();
}

function drawMini(){
  const mc=$('#mini'), c=mc.getContext('2d'); c.clearRect(0,0,mc.width,mc.height); c.drawImage(F.mm,0,0);
  const d=(x,y,s,col)=>{ c.fillStyle=col; c.fillRect(Math.round(x/TS*2-s/2),Math.round(y/TS*2-s/2),s,s); };
  d(F.portal.x,F.portal.y,3,'#5fe8ff'); F.chests.forEach(ch=>d(ch.x,ch.y,2,'#ffd23f')); F.mons.forEach(m=>d(m.x,m.y,m.boss?5:2,m.boss?'#d04aff':'#ff4a4a')); d(F.h.x,F.h.y,3,'#ffffff');
  c.strokeStyle='rgba(255,255,255,.85)'; c.lineWidth=1; c.strokeRect(Math.round(F.cx/TS*2)+.5,Math.round(F.cy/TS*2)+.5,F.vc*2-1,F.vr*2-1);

function drawField(){
  const cv=$('#fieldc'), c=cv.getContext('2d'), W=cv.width, H=cv.height; c.imageSmoothingEnabled=false;
  c.save(); if(F.shake>0) c.translate(rnd(3)-1,rnd(3)-1); c.translate(-Math.round(F.cx),-Math.round(F.cy));
  c.drawImage(F.bg,0,0);
  // exit portal
  const px=F.portal.x, py=F.portal.y+3;
  c.fillStyle='rgba(80,200,255,.28)'; c.beginPath(); c.ellipse(px,py,8,4.5,0,0,7); c.fill();
  for(let k=0;k<6;k++){ const a=F.t*2.4+k*Math.PI/3; RC(c,k%2?'#ffffff':'#bff4ff',Math.round(px+Math.cos(a)*7),Math.round(py+Math.sin(a)*3.5),1,1); }
  RC(c,'#bff4ff',px-1,Math.round(py-12+Math.sin(F.t*4)*1.5),2,3); RC(c,'#bff4ff',px-2,Math.round(py-9+Math.sin(F.t*4)*1.5),4,1);
  // chests
  for(const ch of F.chests){ const b=Math.sin(F.t*3+ch.x)*.5; RC(c,'rgba(0,0,0,.3)',ch.x-6,ch.y-1,12,3); RC(c,'#5a2a0a',ch.x-6,ch.y-8,12,8); RC(c,'#a0602a',ch.x-5,ch.y-7,10,6); RC(c,'#5a2a0a',ch.x-6,ch.y-4,12,1); RC(c,'#ffd23f',ch.x-1,ch.y-5,2,3); if(Math.sin(F.t*5+ch.x)>.8) RC(c,'#ffffff',ch.x+3,Math.round(ch.y-9+b),1,1); }
  if(F.target){ const r=3+Math.sin(F.t*10)*1; c.strokeStyle='rgba(255,255,255,.8)'; c.lineWidth=1; c.beginPath(); c.ellipse(F.target.x,F.target.y+4,r+2,r,0,0,7); c.stroke(); }
  const list=[{y:F.h.y,h:1},...F.mons.map(m=>({y:m.y,m}))].sort((a,b)=>a.y-b.y);
  for(const e of list){
    if(e.h){ const h=F.h, spr=heroSprite().c, fr=h.moving?(Math.floor(h.walk*9)%2):0, bob=h.moving?(fr?-1:0):0;
      c.fillStyle='rgba(0,0,0,.32)'; c.beginPath(); c.ellipse(h.x,h.y,5.5,2,0,0,7); c.fill();
      c.save(); c.translate(Math.round(h.x),Math.round(h.y+bob)); c.scale(h.face,1); c.rotate(h.moving?(fr?.07:-.07):0); c.drawImage(spr,-8,-15); c.restore();
      if(h.alert) ftext(c,'!',h.x,h.y-19+Math.sin(F.t*20),'#ff4040',9);
    } else { const m=e.m, spr=monSprite(m.id).c, sc=m.boss?1.7:1, w=16*sc, ch=m.state==='chase', bob=Math.sin(F.t*(ch?12:5)+m.ph)*(ch?1.6:1);
      if(m.x<F.cx-30||m.x>F.cx+W+30||m.y<F.cy-30||m.y>F.cy+H+60) continue;
      if(m.boss){ const a=.25+.15*Math.sin(F.t*4); c.fillStyle=`rgba(200,60,255,${a})`; c.beginPath(); c.ellipse(m.x,m.y-6,16+Math.sin(F.t*4)*2,13,0,0,7); c.fill(); }
      c.fillStyle='rgba(0,0,0,.32)'; c.beginPath(); c.ellipse(m.x,m.y,5.5*sc,2*sc,0,0,7); c.fill();
      if(m.stun>0&&Math.floor(F.t*10)%2) c.globalAlpha=.45;
      c.drawImage(spr,Math.round(m.x-w/2),Math.round(m.y-w+1+bob),w,w); c.globalAlpha=1;
      if(m.alert>0) ftext(c,'!',m.x,m.y-w-1+Math.sin(F.t*20),'#ffd23f',9);
      if(m.boss) ftext(c,'BOSS',m.x,m.y-w-3-(m.alert>0?8:0),'#ff6a6a',5);
    }
  }
  for(const p of F.ps){ c.globalAlpha=Math.min(1,p.l/p.L*1.6); RC(c,p.col,Math.round(p.x),Math.round(p.y),p.sz,p.sz); } c.globalAlpha=1;
  for(const t of F.texts){ c.globalAlpha=Math.min(1,(1-t.t)*2); ftext(c,t.txt,t.x,t.y,t.col,6); } c.globalAlpha=1;
  c.restore();
  const g=c.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,W*.72); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.38)'); c.fillStyle=g; c.fillRect(0,0,W,H);
  if(F.flash>0&&Math.floor(F.flash*14)%2){ c.fillStyle='rgba(255,255,255,.75)'; c.fillRect(0,0,W,H); }
}
