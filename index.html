    let body='';
    if(tab==='mon'){
      body=REGIONS.map(r=>`<div class="dexh">${r.short}</div><div class="dexg">${[...r.mons,r.boss].map(id=>{ const M=MONS[id], seen=S.seen[id], k=S.dex[id]||0;
        return `<div class="dexc ${seen?'':'unk'}"><img class="px" src="${monSprite(id).url}"><div>${seen?M.n:'???'}</div><small>${seen?'처치 '+k:'미발견'}</small></div>`; }).join('')}</div>`).join('');
      body=`<div class="mono" style="text-align:center">발견 ${Object.keys(S.seen).length}/${ALLMON.length}</div>`+body;
    } else {
      body=`<div class="mono" style="text-align:center">달성 ${S.ach.length}/${ACH.length} · 내 칭호 <span style="color:var(--gold)">${esc(S.title||'없음')}</span></div><div class="achl">`+ACH.map(a=>{ const ok=S.ach.includes(a.id);
        return `<div class="achi ${ok?'ok':''}" ${ok?`data-t="${esc(a.t)}"`:''}><span>${ok?'🏅':'🔒'}</span><div>${a.n}<small>${a.d}${ok?` → 칭호 「${a.t}」`:''}</small></div></div>`; }).join('')+'</div><p style="text-align:center;color:#9fb0ff;font-size:15px">달성한 업적을 누르면 칭호를 바꿀 수 있어요</p>';
    }
    box.innerHTML=`<h3>🏅 도감 · 업적</h3><div class="tabs"><button class="btn small ${tab==='mon'?'gold':''}" data-tab="mon">몬스터 도감</button><button class="btn small ${tab==='ach'?'gold':''}" data-tab="ach">업적</button></div><div class="dexwrap">${body}</div><div class="mbtns"><button class="btn" data-close>닫기</button></div>`;
    box.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ sfx.cursor(); tab=b.dataset.tab; render(box); });
    box.querySelectorAll('.achi.ok').forEach(b=>b.onclick=()=>{ S.title=b.dataset.t; sfx.ok(); save(); render(box); });
    box.querySelector('[data-close]').onclick=()=>{ sfx.select(); $('#modal').classList.add('hidden'); };
  };
  modal('',[],box=>render(box));
}
async function teacher(){
  for(;;){
    const v=await modal(`<h3>👩‍🏫 교사 설정</h3><p style="text-align:center">수업에 맞게 조절해 보세요.</p>`,[{t:`⏱ 문제 제한 시간: ${S.cfg.time}초`,v:'time'},{t:`🔓 모든 시대 열기: ${S.cfg.openAll?'ON':'OFF'}`,v:'open'},{t:'닫기',v:0}]);
    if(v==='time'){ const L=[15,25,40,60]; S.cfg.time=L[(L.indexOf(S.cfg.time)+1)%L.length]; }
    else if(v==='open'){ S.cfg.openAll=S.cfg.openAll?0:1; }
    else break;
    save();
  }
  if($('#scr-map').classList.contains('on')) renderNodes();
}
function unl(){ return S.cfg&&S.cfg.openAll?REGIONS.length:S.unlocked; }

// ================= 매일 미션 · 출석 · 오답 복습 · 튜토리얼 · 교사 잠금 =================
const today=()=>{ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); };
const MISSIONS=[
  {k:'q',n:'문제 10개 풀기',goal:10,gold:40,item:'potion'},
  {k:'ok',n:'정답 8개 맞히기',goal:8,gold:50,item:'ether'},
  {k:'w',n:'몬스터 3마리 물리치기',goal:3,gold:60,item:'potion'},
  {k:'c',n:'한 전투에서 5연속 정답',goal:5,gold:80,item:'ether'},
];
function dailyReset(){ if(!S.daily||S.daily.d!==today()) S.daily={d:today(),q:0,ok:0,w:0,c:0,got:[]}; }
function bump(k,v){ dailyReset(); const D=S.daily; if(k==='c') D.c=Math.max(D.c,v); else D[k]+=(v||1);
  MISSIONS.forEach((m,i)=>{ if(!D.got.includes(i)&&!D['n'+i]&&D[m.k]>=m.goal){ D['n'+i]=1; toast('📅 오늘의 미션 완료! 지도에서 보상을 받으세요'); } }); }
async function attendance(){
  dailyReset(); if(S.lastDay===today()) return;
  const y=new Date(); y.setDate(y.getDate()-1); const yd=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
  S.streak=S.lastDay===yd?(S.streak||0)+1:1; S.lastDay=today();
  const day=((S.streak-1)%7)+1, gold=20+day*10; S.gold+=gold; if(day===7){ S.potion+=2; S.ether+=2; }
  save(); sfx.coin();
  await modal(`<h3>📅 출석 체크!</h3><p style="text-align:center">연속 <b style="color:var(--gold)">${S.streak}일</b> 출석했어요!</p>
    <div class="att">${[1,2,3,4,5,6,7].map(i=>`<div class="${i<=day?'on':''}">${i}일<br>${i===7?'🎁':'🪙'}</div>`).join('')}</div>
    <p style="text-align:center">보상: 🪙 ${gold} G ${day===7?'+ 🧪 포션 2개 + 💧 마나 포션 2개':''}</p><p style="text-align:center;color:#9fb0ff;font-size:15px">7일 연속이면 특별 선물! 매일 와서 역사 공부해요</p>`,[{t:'받기 ▶',v:1,cls:'gold'}]);
  updTop();
}
function missionWin(){
  dailyReset(); const D=S.daily;
  const render=box=>{
    box.innerHTML=`<h3>📅 오늘의 미션</h3><p class="mono" style="text-align:center">연속 출석 ${S.streak||1}일</p>`+MISSIONS.map((m,i)=>{ const v=Math.min(D[m.k],m.goal), done=v>=m.goal, got=D.got.includes(i);
      return `<div class="shopitem"><div class="ic">${got?'✅':done?'🎁':'📌'}</div><div>${m.n}<small>${v}/${m.goal} · 보상 ${m.gold}G + ${m.item==='potion'?'🧪':'💧'}</small><div class="bar mbar"><i style="width:${v/m.goal*100}%"></i></div></div>
      <div><button class="btn small ${done&&!got?'gold':''}" data-m="${i}" ${done&&!got?'':'disabled'}>${got?'완료':'받기'}</button></div></div>`; }).join('')+
      `<p style="text-align:center;color:#9fb0ff;font-size:15px">미션은 매일 새로 바뀌어요</p><div class="mbtns"><button class="btn" data-close>닫기</button></div>`;
    box.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.m, m=MISSIONS[i]; D.got.push(i); S.gold+=m.gold; S[m.item]++; sfx.coin(); toast(`🎁 ${m.gold}G와 ${m.item==='potion'?'체력':'마나'} 포션을 받았다!`); save(); updTop(); render(box); });
    box.querySelector('[data-close]').onclick=()=>{ sfx.select(); $('#modal').classList.add('hidden'); updMissionDot(); };
  };
  modal('',[],box=>render(box));
}
function updMissionDot(){ const b=$('#b-mis'); if(!b||!S) return; dailyReset(); const D=S.daily; const n=MISSIONS.filter((m,i)=>D[m.k]>=m.goal&&!D.got.includes(i)).length; b.classList.toggle('dot',n>0); }

// 오답 복습 전투
function reviewQ(){
  if(!S.wrong.length) return null;
  const w=pick(S.wrong); const src=(QB[w.s]||[]).find(q=>q.q===w.q);
  return src||null;
}
function startReview(){
  if(!S.wrong.length){ toast('복습할 문제가 없어요!'); return; }
  const cnt={}; S.wrong.forEach(w=>{ if(w.s<unl()) cnt[w.s]=(cnt[w.s]||0)+1; });
  const ri=+(Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]||0);
  startBattle(ri,false); B.review=true; $('#b-region').textContent='📖 오답 복습 전투';
}
function reviewHit(q){ const i=S.wrong.findIndex(w=>w.q===q.q); if(i>=0){ S.wrong.splice(i,1); toast('📖 복습 성공! 오답노트에서 지웠어요'); } }

async function tutorial(){
  if(S.tut) return; S.tut=1; save();
  await modal(`<h3>🎓 전투 방법</h3>
    <div class="note">⚔ <b>공격</b>을 누르면 역사 문제가 나와요.</div>
    <div class="note">✅ 맞히면 몬스터를 공격! ❌ 틀리면 몬스터가 공격해요.</div>
    <div class="note">⚡ <b>6초 안에</b> 맞히면 크리티컬! 연속으로 맞히면 콤보로 더 세져요.</div>
    <div class="note">✨ 레벨 2부터 <b>스킬</b>을 쓸 수 있어요. MP를 써서 더 큰 공격!</div>
    <div class="note">📖 틀린 문제는 오답노트에 모여요. 복습 전투로 다시 도전!</div>`,[{t:'알겠어요! ▶',v:1,cls:'gold'}]);
}


// PWA (홈 화면에 설치 · 오프라인)
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredInstall=e; });
try{ if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
async function installApp(){
  if(deferredInstall){ deferredInstall.prompt(); deferredInstall=null; return; }
  await modal(`<h3>📲 앱처럼 설치하기</h3><div class="note">안드로이드 크롬: 오른쪽 위 ⋮ → <b>홈 화면에 추가</b></div><div class="note">아이폰 사파리: 아래 공유 버튼 → <b>홈 화면에 추가</b></div><p style="text-align:center;color:#9fb0ff;font-size:15px">설치하면 인터넷이 없어도 이어서 할 수 있어요</p>`);
}

// ================= MAP BUTTONS =================
$('#b-town').onclick=()=>{sfx.select();town()};
$('#b-note').onclick=()=>{sfx.select();noteBook()};
$('#b-status').onclick=()=>{sfx.select();statusWin()};
$('#b-dex').onclick=()=>{sfx.select();openDex()};
$('#b-mis').onclick=()=>{sfx.select();missionWin()};
$('#b-opt').onclick=()=>{sfx.select();options()};
document.addEventListener('keydown',e=>{ if(!$('#scr-battle').classList.contains('on')||busy.v||!$('#modal').classList.contains('hidden')) return;
  const map={'a':'atk','s':'skill','d':'item','f':'run'}; const c=map[e.key.toLowerCase()]; if(c&&!$('#cmd').classList.contains('hidden')) $(`#cmd [data-c="${c}"]`).click(); });
window.addEventListener('resize',()=>{ if($('#scr-map').classList.contains('on')){ drawMap(); renderNodes(); } if(F&&$('#scr-field').classList.contains('on')) layoutField(); if(BFX) BFX.resize(); if(TFX) TFX.resize(); if(B&&$('#scr-battle').classList.contains('on')) drawBG(REGIONS[B.ri].theme); });

// ================= BOOT =================
BFX=new FXLayer($('#fx'));
initTitle();
{ const amb0=TFX.amb; initTitleAmb=()=>{ TFX.amb=amb0; }; }
requestAnimationFrame(loop);
</script>
